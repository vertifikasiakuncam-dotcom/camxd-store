name: Build CAMXD Store Signed APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "script.js"
      - "style.css"
      - "pwa.js"
      - "manifest.webmanifest"
      - ".github/workflows/build-android.yml"
      - "camxd-background.png"
      - "camxd-store-music.mp3"
      - "camxd-store-voice.mp3"

concurrency:
  group: camxd-store-apk-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          echo "Using sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create native Android WebView project
        shell: bash
        run: |
          set -e
          rm -rf store-android
          mkdir -p store-android/app/src/main/java/com/camxd/store
          mkdir -p store-android/app/src/main/res/values
          mkdir -p store-android/app/src/main/res/values-v31
          mkdir -p store-android/app/src/main/res/drawable-nodpi
          mkdir -p store-android/app/src/main/res/raw

          cp camxd-logo.png store-android/app/src/main/res/drawable-nodpi/camxd_logo.png
          cp camxd-background.png store-android/app/src/main/res/drawable-nodpi/camxd_background.png
          cp camxd-store-music.mp3 store-android/app/src/main/res/raw/camxd_store_music.mp3
          cp camxd-store-voice.mp3 store-android/app/src/main/res/raw/camxd_store_voice.mp3

          cat > store-android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name="CAMXDStore"
          include(":app")
          EOF

          cat > store-android/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > store-android/build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
            id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

          cat > store-android/app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
            id 'com.google.gms.google-services'
          }
          dependencies {
            implementation platform('com.google.firebase:firebase-bom:34.3.0')
            implementation 'com.google.firebase:firebase-messaging'
          }
          android {
            namespace 'com.camxd.store'
            compileSdk 35
            defaultConfig {
              applicationId 'com.camxd.store'
              minSdk 23
              targetSdk 35
              versionCode 3
              versionName '1.0.2'
            }
          }
          EOF

          cat > store-android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#ffd000</item>
              <item name="android:statusBarColor">#050505</item>
              <item name="android:navigationBarColor">#050505</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowBackground">#ffffff</item>
            </style>
          </resources>
          EOF

          cat > store-android/app/src/main/res/values-v31/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#ffd000</item>
              <item name="android:statusBarColor">#080808</item>
              <item name="android:navigationBarColor">#050505</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowBackground">#211400</item>
              <item name="android:windowSplashScreenBackground">#ffffff</item>
              <item name="android:windowSplashScreenAnimationDuration">0</item>
            </style>
          </resources>
          EOF

          cat > store-android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <application
              android:theme="@style/AppTheme"
              android:label="CAMXD STORE"
              android:icon="@drawable/camxd_logo"
              android:allowBackup="false"
              android:usesCleartextTraffic="false">
              <meta-data
                android:name="com.google.firebase.messaging.default_notification_channel_id"
                android:value="camxd_order_updates"/>
              <service
                android:name=".CamxdFirebaseMessagingService"
                android:exported="false">
                <intent-filter>
                  <action android:name="com.google.firebase.MESSAGING_EVENT"/>
                </intent-filter>
              </service>
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:screenOrientation="portrait">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > store-android/app/src/main/java/com/camxd/store/CamxdFirebaseMessagingService.java <<'EOF'
          package com.camxd.store;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.os.Build;
          import android.text.TextUtils;
          import android.util.Log;

          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.Map;

          public class CamxdFirebaseMessagingService extends FirebaseMessagingService {
            private static final String TAG = "CAMXDFCM";
            private static final String CHANNEL_ID = "camxd_order_updates";

            @Override public void onNewToken(String token) {
              super.onNewToken(token);
              // Token registration with the CAMXD backend is wired in the next integration step.
              Log.i(TAG, "FCM token refreshed; length=" + (token == null ? 0 : token.length()));
            }

            @Override public void onMessageReceived(RemoteMessage message) {
              super.onMessageReceived(message);
              Map<String, String> data = message.getData();
              String title = data.get("title");
              String body = data.get("body");
              String imageUrl = data.get("image");
              if (message.getNotification() != null) {
                if (TextUtils.isEmpty(title)) title = message.getNotification().getTitle();
                if (TextUtils.isEmpty(body)) body = message.getNotification().getBody();
                if (TextUtils.isEmpty(imageUrl)) imageUrl = message.getNotification().getImageUrl() == null
                    ? null : message.getNotification().getImageUrl().toString();
              }
              if (TextUtils.isEmpty(title)) title = "CAMXD STORE";
              if (TextUtils.isEmpty(body)) body = "Ada pembaruan pesanan Anda.";
              String orderId = data.get("order_id");
              String customerWa = data.get("customer_wa");
              showNotification(title, body, imageUrl, orderId, customerWa);
            }

            private void showNotification(String title, String body, String imageUrl, String orderId, String customerWa) {
              NotificationManager manager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
              if (manager == null) return;
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                NotificationChannel channel = new NotificationChannel(
                    CHANNEL_ID, "Notifikasi Pesanan CAMXD", NotificationManager.IMPORTANCE_HIGH);
                channel.setDescription("Pembaruan pembayaran dan status pesanan CAMXD Store");
                manager.createNotificationChannel(channel);
              }

              Intent intent = new Intent(this, MainActivity.class);
              intent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
              if (!TextUtils.isEmpty(orderId)) intent.putExtra("camxd_order_id", orderId);
              if (!TextUtils.isEmpty(customerWa)) intent.putExtra("camxd_customer_wa", customerWa);
              PendingIntent pendingIntent = PendingIntent.getActivity(
                  this, (int) System.currentTimeMillis(), intent,
                  PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0));

              Notification.Builder builder = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                  ? new Notification.Builder(this, CHANNEL_ID)
                  : new Notification.Builder(this);
              builder.setSmallIcon(R.drawable.camxd_logo)
                  .setContentTitle(title)
                  .setContentText(body)
                  .setStyle(new Notification.BigTextStyle().bigText(body))
                  .setAutoCancel(true)
                  .setContentIntent(pendingIntent)
                  .setCategory(Notification.CATEGORY_STATUS)
                  .setPriority(Notification.PRIORITY_HIGH);

              Bitmap image = downloadImage(imageUrl);
              if (image != null) {
                builder.setLargeIcon(image);
                builder.setStyle(new Notification.BigPictureStyle().bigPicture(image).bigLargeIcon((Bitmap) null));
              }

              manager.notify((int) (System.currentTimeMillis() & 0x7fffffff), builder.build());
            }

            private Bitmap downloadImage(String imageUrl) {
              if (TextUtils.isEmpty(imageUrl) || !imageUrl.startsWith("https://")) return null;
              HttpURLConnection connection = null;
              try {
                connection = (HttpURLConnection) new URL(imageUrl).openConnection();
                connection.setConnectTimeout(3500);
                connection.setReadTimeout(3500);
                connection.setInstanceFollowRedirects(true);
                connection.connect();
                if (connection.getResponseCode() != 200) return null;
                try (InputStream input = connection.getInputStream()) {
                  return BitmapFactory.decodeStream(input);
                }
              } catch (Exception e) {
                Log.w(TAG, "Unable to load notification image", e);
                return null;
              } finally {
                if (connection != null) connection.disconnect();
              }
            }
          }
          EOF

          cat > store-android/app/src/main/java/com/camxd/store/MainActivity.java <<'EOF'
          package com.camxd.store;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.util.Log;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import com.google.firebase.messaging.FirebaseMessaging;
          import android.net.Uri;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.LinearGradient;
          import android.graphics.Shader;
          import android.media.MediaPlayer;
          import android.view.View;
          import android.view.Window;
          import android.webkit.ValueCallback;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {
            private WebView webView;
            private ValueCallback<Uri[]> pendingFileCallback;
            private long lastBackPress=0;
            private MediaPlayer mainMusic;
            private boolean musicMuted=false;

            @Override protected void onCreate(Bundle savedInstanceState){
              super.onCreate(savedInstanceState);
              Window window=getWindow();
              window.setStatusBarColor(Color.TRANSPARENT);
              window.setNavigationBarColor(Color.TRANSPARENT);
              window.getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
              );
              showIntro();
              requestNotificationPermission();
              FirebaseMessaging.getInstance().getToken().addOnCompleteListener(task -> {
                if (task.isSuccessful()) {
                  String token = task.getResult();
                  Log.i("CAMXDFCM", "FCM token ready; length=" + (token == null ? 0 : token.length()));
                } else {
                  Log.w("CAMXDFCM", "Unable to obtain FCM token", task.getException());
                }
              });
            }

            private void requestNotificationPermission(){
              if (Build.VERSION.SDK_INT >= 33 &&
                  checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 2002);
              }
            }

            private void showIntro(){
              setContentView(new StaticIntroView());
            }

            private final class StaticIntroView extends View {
              private final Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Bitmap background;
              private final long startTime=System.currentTimeMillis();
              private final long duration=6400L;
              private MediaPlayer introVoice;
              private boolean soundStarted=false;

              StaticIntroView(){
                super(MainActivity.this);
                setLayerType(View.LAYER_TYPE_SOFTWARE,null);
                background=BitmapFactory.decodeResource(getResources(),R.drawable.camxd_background);
                postInvalidateOnAnimation();
              }

              private void playIntroSound(){
                if(soundStarted) return;
                soundStarted=true;
                try{
                  introVoice=MediaPlayer.create(MainActivity.this,R.raw.camxd_store_voice);
                  if(introVoice!=null){
                    introVoice.setVolume(1.0f,1.0f);
                    introVoice.setOnCompletionListener(mp -> {
                      try{ mp.release(); }catch(Exception ignored){}
                      introVoice=null;
                    });
                    introVoice.setOnErrorListener((mp,what,extra) -> {
                      try{ mp.release(); }catch(Exception ignored){}
                      introVoice=null;
                      return true;
                    });
                    introVoice.start();
                  }
                }catch(Exception ignored){}
              }

              private void stopIntroSound(){
                try{
                  if(introVoice!=null){
                    if(introVoice.isPlaying()) introVoice.stop();
                    introVoice.release();
                    introVoice=null;
                  }
                }catch(Exception ignored){}
              }

              @Override protected void onDraw(Canvas c){
                super.onDraw(c);
                final float w=getWidth(), h=getHeight();
                final float t=Math.min(1f,(System.currentTimeMillis()-startTime)/(float)duration);

                if(!soundStarted) playIntroSound();

                p.setAlpha(255);
                p.setStyle(Paint.Style.FILL);
                p.setShader(null);
                p.setFilterBitmap(true);
                c.drawBitmap(background,null,new RectF(0,0,w,h),p);

                // Dynamic loading UI: the artwork stays clean; only this text and bar animate.
                final float barX=w*0.155f;
                final float barW=w*0.690f;
                final float barY=h*0.742f;
                final float barH=Math.max(30f,h*0.043f);

                p.setTypeface(android.graphics.Typeface.create("sans-serif",android.graphics.Typeface.BOLD));
                p.setTextAlign(Paint.Align.CENTER);
                p.setTextSize(Math.max(18f,w*0.035f));
                p.setColor(Color.rgb(255,226,70));
                p.setShadowLayer(12f,0f,0f,Color.rgb(255,150,0));
                c.drawText("MEMUAT CAMXD STORE",w/2f,barY-p.getTextSize()*0.85f,p);
                p.clearShadowLayer();

                p.setStyle(Paint.Style.FILL);
                p.setColor(Color.argb(210,20,10,4));
                c.drawRoundRect(new RectF(barX,barY,barX+barW,barY+barH),barH*0.48f,barH*0.48f,p);

                p.setStyle(Paint.Style.STROKE);
                p.setStrokeWidth(Math.max(3f,w*0.004f));
                p.setColor(Color.rgb(255,205,60));
                p.setShadowLayer(10f,0f,0f,Color.rgb(255,155,0));
                c.drawRoundRect(new RectF(barX,barY,barX+barW,barY+barH),barH*0.48f,barH*0.48f,p);
                p.clearShadowLayer();

                float innerX=barX+10f;
                float innerY=barY+10f;
                float innerW=Math.max(0f,(barW-20f)*t);
                float innerH=Math.max(4f,barH-20f);

                if(innerW>0f){
                  p.setStyle(Paint.Style.FILL);
                  p.setShader(new LinearGradient(innerX,0,innerX+Math.max(1f,barW-20f),0,
                    Color.rgb(255,150,0),Color.rgb(255,246,150),Shader.TileMode.CLAMP));
                  p.setShadowLayer(14f,0f,0f,Color.rgb(255,170,20));
                  c.drawRoundRect(new RectF(innerX,innerY,innerX+innerW,innerY+innerH),
                    innerH*0.45f,innerH*0.45f,p);
                  p.clearShadowLayer();
                  p.setShader(null);

                  // Moving golden highlight.
                  float shineX=innerX+innerW-Math.min(22f,innerH*0.9f);
                  p.setColor(Color.argb(230,255,255,225));
                  c.drawCircle(shineX,innerY+innerH/2f,Math.max(4f,innerH*0.34f),p);
                }

                if(t<1f){
                  postInvalidateOnAnimation();
                }else{
                  postDelayed(() -> { stopIntroSound(); setupWebView(); },180);
                }
              }

              @Override protected void onDetachedFromWindow(){
                stopIntroSound();
                super.onDetachedFromWindow();
              }
            }

            private void setupWebView(){
              webView=new WebView(this);
              setContentView(webView);
              WebSettings s=webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setSupportZoom(false);
              s.setBuiltInZoomControls(false);
              s.setDisplayZoomControls(false);
              s.setMediaPlaybackRequiresUserGesture(false);

              webView.addJavascriptInterface(new Object(){
                @JavascriptInterface public void setMuted(boolean muted){
                  musicMuted=muted;
                  if(mainMusic!=null){
                    try{ mainMusic.setVolume(muted?0f:0.25f,muted?0f:0.25f); }catch(Exception ignored){}
                  }
                }
              },"CAMXDMusic");

              webView.addJavascriptInterface(new Object(){
                @JavascriptInterface public void registerForOrder(String orderId, String customerWa){
                  final String safeOrderId = orderId == null ? "" : orderId.trim();
                  final String safeWa = customerWa == null ? "" : customerWa.trim();
                  FirebaseMessaging.getInstance().getToken().addOnCompleteListener(task -> {
                    if(!task.isSuccessful() || task.getResult() == null){
                      notifyWebFcmResult(false, "Token notifikasi Android belum tersedia.");
                      return;
                    }
                    final String token = task.getResult();
                    new Thread(() -> {
                      HttpURLConnection connection = null;
                      boolean ok = false;
                      String message = "Pendaftaran notifikasi gagal.";
                      try {
                        URL url = new URL("https://tbgpisneezbrkygbxwyg.supabase.co/functions/v1/customer-fcm-register");
                        connection = (HttpURLConnection) url.openConnection();
                        connection.setRequestMethod("POST");
                        connection.setConnectTimeout(10000);
                        connection.setReadTimeout(10000);
                        connection.setDoOutput(true);
                        connection.setRequestProperty("Content-Type", "application/json");
                        connection.setRequestProperty("apikey", "sb_publishable_gGe_VnO98UdAyMZfCr696Q_9qiPsYaM");
                        org.json.JSONObject payload = new org.json.JSONObject();
                        payload.put("order_id", safeOrderId);
                        payload.put("customer_wa", safeWa);
                        payload.put("token", token);
                        payload.put("user_agent", "CAMXD Store Android APK");
                        byte[] bytes = payload.toString().getBytes(java.nio.charset.StandardCharsets.UTF_8);
                        try(java.io.OutputStream output = connection.getOutputStream()){ output.write(bytes); }
                        int status = connection.getResponseCode();
                        java.io.InputStream stream = status >= 200 && status < 300 ? connection.getInputStream() : connection.getErrorStream();
                        StringBuilder responseText = new StringBuilder();
                        if(stream != null){
                          try(java.io.BufferedReader reader = new java.io.BufferedReader(new java.io.InputStreamReader(stream, java.nio.charset.StandardCharsets.UTF_8))){
                            String line; while((line=reader.readLine())!=null) responseText.append(line);
                          }
                        }
                        org.json.JSONObject response = new org.json.JSONObject(responseText.toString());
                        ok = status >= 200 && status < 300 && response.optBoolean("ok", false);
                        message = response.optString("message", response.optString("error", message));
                      } catch(Exception e){
                        Log.w("CAMXDFCM", "FCM registration request failed", e);
                        message = "Tidak dapat mendaftarkan notifikasi. Periksa koneksi internet.";
                      } finally {
                        if(connection != null) connection.disconnect();
                      }
                      notifyWebFcmResult(ok, message);
                    }).start();
                  });
                }
              },"CAMXDFCM");

              webView.setWebChromeClient(new WebChromeClient(){
                @Override public boolean onShowFileChooser(WebView view,ValueCallback<Uri[]> callback,FileChooserParams params){
                  pendingFileCallback=callback;
                  try{ startActivityForResult(params.createIntent(),1001); }
                  catch(Exception e){
                    pendingFileCallback=null;
                    callback.onReceiveValue(null);
                    Toast.makeText(MainActivity.this,"Tidak dapat membuka pemilih file",Toast.LENGTH_SHORT).show();
                  }
                  return true;
                }
              });

              webView.setWebViewClient(new WebViewClient(){
                @Override public void onPageFinished(WebView view,String url){
                  startMainMusic();
                }
                @Override public boolean shouldOverrideUrlLoading(WebView view,WebResourceRequest request){
                  return handleUrl(view,request.getUrl().toString());
                }
                @Override public boolean shouldOverrideUrlLoading(WebView view,String url){
                  return handleUrl(view,url);
                }
              });
              webView.loadUrl("https://vertifikasiakuncam-dotcom.github.io/camxd-store/?v=20261007-store-final2");
              handleOrderNotificationIntent(getIntent());
            }

            @Override protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              setIntent(intent);
              handleOrderNotificationIntent(intent);
            }

            private void handleOrderNotificationIntent(Intent intent) {
              if (intent == null) return;
              String orderId = intent.getStringExtra("camxd_order_id");
              String customerWa = intent.getStringExtra("camxd_customer_wa");
              if (orderId == null || orderId.trim().isEmpty()) return;
              final String safeOrderId = orderId.trim().toUpperCase(java.util.Locale.ROOT);
              final String safeWa = customerWa == null ? "" : customerWa.trim();
              webView.postDelayed(() -> {
                if (webView == null) return;
                try {
                  org.json.JSONObject payload = new org.json.JSONObject();
                  payload.put("orderId", safeOrderId);
                  payload.put("customerWa", safeWa);
                  String js = "(function(p){" +
                    "var go=function(){" +
                    "var id=document.getElementById('checkOrderId');" +
                    "var wa=document.getElementById('checkOrderWa');" +
                    "var form=document.getElementById('orderCheckForm');" +
                    "if(!id||!wa||!form)return false;" +
                    "id.value=p.orderId;" +
                    "wa.value=p.customerWa;" +
                    "location.hash='cek-pesanan';" +
                    "if(p.customerWa){form.requestSubmit?form.requestSubmit():form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));}" +
                    "return true;" +
                    "};" +
                    "var n=0;var timer=setInterval(function(){if(go()||++n>30)clearInterval(timer);},250);" +
                    "})(" + payload.toString() + ");";
                  webView.evaluateJavascript(js, null);
                } catch (Exception e) {
                  Log.w("CAMXDFCM", "Unable to open order from notification", e);
                }
              }, 800);
              intent.removeExtra("camxd_order_id");
              intent.removeExtra("camxd_customer_wa");
            }

            private void notifyWebFcmResult(boolean ok, String message){
              runOnUiThread(() -> {
                if(webView == null) return;
                try{
                  org.json.JSONObject result = new org.json.JSONObject();
                  result.put("ok", ok);
                  result.put("message", message == null ? "" : message);
                  webView.evaluateJavascript("window.onCamxdFcmResult && window.onCamxdFcmResult(" + result.toString() + ");", null);
                }catch(Exception e){
                  Log.w("CAMXDFCM", "Unable to return FCM result to checkout", e);
                }
              });
            }

            private void startMainMusic(){
              if(mainMusic!=null){
                if(!mainMusic.isPlaying()){
                  try{ mainMusic.start(); }catch(Exception ignored){}
                }
                try{ mainMusic.setVolume(musicMuted?0f:0.25f,musicMuted?0f:0.25f); }catch(Exception ignored){}
                return;
              }
              try{
                mainMusic=MediaPlayer.create(this,R.raw.camxd_store_music);
                if(mainMusic!=null){
                  mainMusic.setLooping(true);
                  mainMusic.setVolume(musicMuted?0f:0.25f,musicMuted?0f:0.25f);
                  mainMusic.start();
                }
              }catch(Exception ignored){}
            }

            private boolean handleUrl(WebView view,String url){
              if(url.startsWith("https://wa.me/")||url.startsWith("whatsapp://")){
                try{ startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse(url))); }
                catch(Exception e){ Toast.makeText(this,"WhatsApp tidak ditemukan",Toast.LENGTH_SHORT).show(); }
                return true;
              }
              if(url.endsWith(".apk")||url.contains("/downloads/")){
                try{
                  Intent i=new Intent(Intent.ACTION_VIEW,Uri.parse(url));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  startActivity(i);
                }catch(Exception e){ Toast.makeText(this,"Tidak dapat membuka file APK",Toast.LENGTH_SHORT).show(); }
                return true;
              }
              if(url.startsWith("http://")||url.startsWith("https://")){
                view.loadUrl(url);
                return true;
              }
              try{ startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse(url))); }
              catch(Exception e){ Toast.makeText(this,"Aplikasi untuk membuka link tidak ditemukan",Toast.LENGTH_SHORT).show(); }
              return true;
            }

            @Override public void onBackPressed(){
              if(webView!=null&&webView.canGoBack()){ webView.goBack(); return; }
              long now=System.currentTimeMillis();
              if(now-lastBackPress<1800){ super.onBackPressed(); return; }
              lastBackPress=now;
              Toast.makeText(this,"Tekan sekali lagi untuk keluar",Toast.LENGTH_SHORT).show();
            }

            @Override protected void onActivityResult(int requestCode,int resultCode,Intent data){
              if(requestCode==1001&&pendingFileCallback!=null){
                Uri[] results=null;
                if(resultCode==RESULT_OK&&data!=null&&data.getData()!=null) results=new Uri[]{data.getData()};
                pendingFileCallback.onReceiveValue(results);
                pendingFileCallback=null;
              }
              super.onActivityResult(requestCode,resultCode,data);
            }

            @Override protected void onPause(){
              super.onPause();
              if(mainMusic!=null&&mainMusic.isPlaying()){
                try{ mainMusic.pause(); }catch(Exception ignored){}
              }
            }

            @Override protected void onResume(){
              super.onResume();
              if(mainMusic!=null&&!mainMusic.isPlaying()){
                try{ mainMusic.start(); }catch(Exception ignored){}
              }
              if(mainMusic!=null){
                try{ mainMusic.setVolume(musicMuted?0f:0.25f,musicMuted?0f:0.25f); }catch(Exception ignored){}
              }
            }

            @Override protected void onDestroy(){
              if(mainMusic!=null){
                try{ mainMusic.stop(); }catch(Exception ignored){}
                try{ mainMusic.release(); }catch(Exception ignored){}
                mainMusic=null;
              }
              if(pendingFileCallback!=null){ pendingFileCallback.onReceiveValue(null); pendingFileCallback=null; }
              if(webView!=null){ webView.destroy(); webView=null; }
              super.onDestroy();
            }
          }
          EOF

      - name: Configure Firebase Android app
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          test -n "$FIREBASE_GOOGLE_SERVICES_JSON" || { echo "Missing FIREBASE_GOOGLE_SERVICES_JSON repository secret"; exit 1; }
          python3 - <<'PY'
          import json, os
          raw = os.environ["FIREBASE_GOOGLE_SERVICES_JSON"]
          config = json.loads(raw)
          clients = config.get("client", [])
          matches = [
              c for c in clients
              if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.camxd.store"
          ]
          if not matches:
              raise SystemExit("google-services.json does not contain Android package com.camxd.store")
          with open("store-android/app/google-services.json", "w", encoding="utf-8") as f:
              json.dump(config, f, ensure_ascii=False)
          print("Firebase config validated for com.camxd.store")
          PY

      - name: Build and sign
        working-directory: store-android
        shell: bash
        env:
          CAMXD_KEYSTORE_BASE64: ${{ secrets.CAMXD_KEYSTORE_BASE64 }}
          CAMXD_KEYSTORE_PASSWORD: ${{ secrets.CAMXD_KEYSTORE_PASSWORD }}
          CAMXD_KEY_PASSWORD: ${{ secrets.CAMXD_KEY_PASSWORD }}
          CAMXD_KEY_ALIAS: ${{ secrets.CAMXD_KEY_ALIAS }}
        run: |
          set -e

          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export GRADLE=/tmp/gradle-8.10.2/bin/gradle

          $GRADLE --no-daemon :app:assembleRelease

          mkdir -p ../signed

          python3 - <<'PY'
          import base64, os
          s = os.environ["CAMXD_KEYSTORE_BASE64"]
          s = "".join(s.split())
          s += "=" * ((4 - len(s) % 4) % 4)
          with open("../signed/key.jks", "wb") as f:
              f.write(base64.b64decode(s, validate=False))
          PY

          keytool -list -keystore ../signed/key.jks -storepass "$CAMXD_KEYSTORE_PASSWORD" -alias "$CAMXD_KEY_ALIAS" >/dev/null

          BT="$ANDROID_HOME/build-tools/35.0.0"

          "$BT/zipalign" -f 4             app/build/outputs/apk/release/app-release-unsigned.apk             ../signed/aligned.apk

          "$BT/apksigner" sign             --ks ../signed/key.jks             --ks-key-alias "$CAMXD_KEY_ALIAS"             --ks-pass env:CAMXD_KEYSTORE_PASSWORD             --key-pass env:CAMXD_KEY_PASSWORD             --out ../signed/CAMXD-Store.apk             ../signed/aligned.apk

          "$BT/apksigner" verify --verbose ../signed/CAMXD-Store.apk

          rm -f ../signed/key.jks ../signed/aligned.apk

      - name: Publish APK to website
        shell: bash
        run: |
          set -e
          mkdir -p downloads
          cp signed/CAMXD-Store.apk downloads/CAMXD-Store.apk

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f downloads/CAMXD-Store.apk
          if git diff --cached --quiet; then
            echo "APK tidak berubah dari file yang sudah dipublikasikan."
          else
            git commit -m "Publish CAMXD Store APK"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CAMXD-Store-APK
          path: signed/CAMXD-Store.apk
          if-no-files-found: error
          retention-days: 30
