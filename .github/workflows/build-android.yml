name: Build CAMXD Store Signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate Android project
        shell: bash
        run: |
          set -e
          rm -rf android
          mkdir -p android
          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME_17_X64",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          yes '' | bubblewrap init \
            --manifest="https://vertifikasiakuncam-dotcom.github.io/camxd-store/manifest.webmanifest" \
            --directory=android

      - name: Build Android package
        working-directory: android
        run: bubblewrap build --skipSigning --skipPwaValidation

      - name: Sign APK for testing
        shell: bash
        run: |
          set -e

          UNSIGNED_APK=""
          for candidate in \
            "android/app-release-unsigned-aligned.apk" \
            "android/app/build/outputs/apk/release/app-release-unsigned.apk"; do
            if [ -f "$candidate" ]; then
              UNSIGNED_APK="$candidate"
              break
            fi
          done

          if [ -z "$UNSIGNED_APK" ]; then
            echo "Unsigned APK not found"
            find android -type f -name "*.apk" -print
            exit 1
          fi

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          KEYSTORE="$RUNNER_TEMP/camxd-test.keystore"
          ALIGNED_APK="$RUNNER_TEMP/CAMXD-Store-aligned.apk"
          SIGNED_APK="$RUNNER_TEMP/CAMXD-Store-signed.apk"
          STOREPASS=$(openssl rand -hex 24)

          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -alias camxd-test \
            -storepass "$STOREPASS" \
            -keypass "$STOREPASS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CAMXD Store, OU=CAMXD, O=CAMXD Store, C=ID"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:$STOREPASS" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED_APK"

          mkdir -p dist
          cp "$SIGNED_APK" "dist/CAMXD-Store-signed.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CAMXD-Store-Signed-APK
          path: dist/CAMXD-Store-signed.apk
          if-no-files-found: error
          retention-days: 14
