name: Build CAMXD Store Signed APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "script.js"
      - "style.css"
      - "pwa.js"
      - "manifest.webmanifest"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          echo "Using sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create native Android WebView project
        shell: bash
        run: |
          set -e
          rm -rf store-android
          mkdir -p store-android/app/src/main/java/com/camxd/store
          mkdir -p store-android/app/src/main/res/values
          mkdir -p store-android/app/src/main/res/values-v31
          mkdir -p store-android/app/src/main/res/drawable-nodpi

          cp camxd-logo.png store-android/app/src/main/res/drawable-nodpi/camxd_logo.png

          cat > store-android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name="CAMXDStore"
          include(":app")
          EOF

          cat > store-android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          cat > store-android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.camxd.store'
            compileSdk 35
            defaultConfig {
              applicationId 'com.camxd.store'
              minSdk 23
              targetSdk 35
              versionCode 2
              versionName '1.0.1'
            }
          }
          EOF

          cat > store-android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#ffd000</item>
              <item name="android:statusBarColor">#211400</item>
              <item name="android:navigationBarColor">#211400</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowBackground">#211400</item>
            </style>
          </resources>
          EOF

          cat > store-android/app/src/main/res/values-v31/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#ffd000</item>
              <item name="android:statusBarColor">#080808</item>
              <item name="android:navigationBarColor">#050505</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowBackground">#211400</item>
              <item name="android:windowSplashScreenBackground">#211400</item>
              <item name="android:windowSplashScreenAnimatedIcon">@drawable/camxd_logo</item>
              <item name="android:windowSplashScreenAnimationDuration">500</item>
            </style>
          </resources>
          EOF

          cat > store-android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application
              android:theme="@style/AppTheme"
              android:label="CAMXD STORE"
              android:icon="@drawable/camxd_logo"
              android:allowBackup="false"
              android:usesCleartextTraffic="false">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:screenOrientation="portrait">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > store-android/app/src/main/java/com/camxd/store/MainActivity.java <<'EOF'
          package com.camxd.store;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.LinearGradient;
           import android.graphics.RadialGradient;
          import android.graphics.Shader;
          import android.content.res.ColorStateList;
          import android.animation.ObjectAnimator;
          import android.graphics.Typeface;
          import android.media.AudioFormat;
          import android.media.AudioManager;
          import android.media.AudioTrack;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewTreeObserver;
          import android.view.animation.AccelerateDecelerateInterpolator;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.ValueCallback;
          import android.content.Intent;
          import android.net.Uri;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.Random;

          public class MainActivity extends Activity {
            private WebView webView;
            private long lastBackPress = 0;
            private ValueCallback<Uri[]> pendingFileCallback;
            private AudioTrack introAudio;

            private static class GoldIntroView extends View {
              private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Random random = new Random(2026);
              private final float[] ps = new float[54];
              private final long startedAt = System.currentTimeMillis();

              GoldIntroView(android.content.Context context) {
                super(context);
                setLayerType(View.LAYER_TYPE_SOFTWARE, null);
                for(int i=0;i<ps.length;i++) ps[i]=1.2f+random.nextFloat()*3.8f;
              }

              private void drawGoldCloud(Canvas canvas,float x,float y,float scale){
                paint.setShader(new RadialGradient(x+100f*scale,y-5f*scale,125f*scale,
                  new int[]{Color.argb(120,255,190,35),Color.argb(48,255,145,0),Color.argb(0,255,100,0)},
                  new float[]{0f,0.55f,1f},Shader.TileMode.CLAMP));
                canvas.drawOval(new RectF(x,y-70f*scale,x+250f*scale,y+75f*scale),paint);
                paint.setShader(null);
                paint.setColor(Color.argb(75,255,176,8));
                canvas.drawCircle(x+55f*scale,y,58f*scale,paint);
                canvas.drawCircle(x+112f*scale,y-30f*scale,78f*scale,paint);
                canvas.drawCircle(x+178f*scale,y+5f*scale,55f*scale,paint);
                paint.setColor(Color.argb(32,255,230,130));
                canvas.drawOval(new RectF(x+18f*scale,y-28f*scale,x+215f*scale,y+35f*scale),paint);
              }

              private void drawLoading(Canvas canvas,float cx,float cy,float scale,float elapsed){
                float p=(elapsed-1.82f)*3.2f;
                paint.setStyle(Paint.Style.STROKE);
                paint.setStrokeWidth(2.8f);
                paint.setColor(Color.argb(210,255,193,7));
                paint.setShadowLayer(12f,0,0,Color.rgb(255,170,0));
                float r=19f*scale;
                float sweep=85f+105f*(float)Math.abs(Math.sin(p));
                canvas.drawArc(new RectF(cx-r,cy-r,cx+r,cy+r),p*130f,sweep,false,paint);
                paint.clearShadowLayer();

                paint.setStyle(Paint.Style.FILL);
                for(int i=0;i<3;i++){
                  float phase=p-(i*0.65f);
                  float pulse=0.55f+0.45f*(float)((Math.sin(phase)+1f)/2f);
                  paint.setColor(Color.argb((int)(180*pulse),255,193,7));
                  canvas.drawCircle(cx+(i-1)*13f*scale,cy+31f*scale,2.8f*scale*pulse,paint);
                }
              }

              private float clamp(float x){ return Math.max(0f,Math.min(1f,x)); }
              private float ease(float x){
                x=clamp(x);
                return x*x*(3f-2f*x);
              }

              @Override protected void onDraw(Canvas canvas) {
                float w=getWidth(), h=getHeight();
                float elapsed=(System.currentTimeMillis()-startedAt)/1000f;
                float cx=w/2f, cy=h*0.405f;
                // Full-screen cinematic gold-cloud atmosphere.
                paint.setStyle(Paint.Style.FILL);
                paint.setShader(new LinearGradient(0,0,0,h,
                  new int[]{Color.rgb(62,34,3),Color.rgb(92,48,3),Color.rgb(48,25,2)},
                  new float[]{0f,0.50f,1f},Shader.TileMode.CLAMP));
                canvas.drawRect(0,0,w,h,paint);
                paint.setShader(null);

                float sway=(float)Math.sin(elapsed*0.55f)*w*0.025f;

                // Large cloud banks around the whole frame.
                drawGoldCloud(canvas,-180f+sway,h*0.08f,2.7f);
                drawGoldCloud(canvas,w*0.58f-sway,h*0.10f,2.55f);
                drawGoldCloud(canvas,-220f-sway,h*0.36f,2.35f);
                drawGoldCloud(canvas,w*0.60f+sway,h*0.35f,2.45f);
                drawGoldCloud(canvas,-250f+sway,h*0.67f,2.7f);
                drawGoldCloud(canvas,w*0.58f-sway,h*0.68f,2.6f);
                drawGoldCloud(canvas,-170f,h*0.88f,2.5f);
                drawGoldCloud(canvas,w*0.56f,h*0.87f,2.55f);

                // Warm atmospheric glow behind the logo.
                paint.setShader(new RadialGradient(cx,h*0.43f,Math.min(w,h)*0.48f,
                  new int[]{Color.argb(125,255,180,20),Color.argb(45,255,130,0),Color.argb(0,255,120,0)},
                  new float[]{0f,0.45f,1f},Shader.TileMode.CLAMP));
                canvas.drawCircle(cx,h*0.43f,Math.min(w,h)*0.48f,paint);
                paint.setShader(null);

                // Golden horizon glow at the bottom.
                paint.setShader(new RadialGradient(cx,h*0.86f,Math.min(w,h)*0.52f,
                  Color.argb(100,255,185,25),Color.argb(0,255,120,0),Shader.TileMode.CLAMP));
                canvas.drawCircle(cx,h*0.86f,Math.min(w,h)*0.52f,paint);
                paint.setShader(null);

                // Sun rays rising through the clouds.
                paint.setStyle(Paint.Style.STROKE);
                paint.setStrokeWidth(3f);
                paint.setColor(Color.argb(48,255,190,35));
                for(int i=0;i<18;i++){
                  float x2=(i/17f)*w;
                  canvas.drawLine(cx,h*0.48f,x2,h*0.05f,paint);
                }

                // 1) Gold flare is born from a single point.
                float flare=ease(clamp(elapsed/0.42f));
                if(elapsed<0.75f){
                  float radius=Math.min(w,h)*(0.012f+0.22f*flare);
                  paint.setStyle(Paint.Style.FILL);
                  paint.setColor(Color.argb((int)(235*(1f-flare*0.55f)),255,205,45));
                  paint.setShadowLayer(42f*flare,0,0,Color.rgb(255,170,0));
                  canvas.drawCircle(cx,cy,radius,paint);
                  paint.clearShadowLayer();
                }

                // 2) A bright gold light draws the ring around the logo.
                float ringProgress=ease(clamp((elapsed-0.28f)/0.92f));
                if(ringProgress>0f){
                  float r=Math.min(w,h)*0.205f;
                  paint.setStyle(Paint.Style.STROKE);
                  paint.setStrokeWidth(5.5f);
                  paint.setColor(Color.argb(235,255,193,7));
                  paint.setShadowLayer(26f,0,0,Color.rgb(255,168,0));
                  RectF oval=new RectF(cx-r,cy-r,cx+r,cy+r);
                  canvas.drawArc(oval,-90f,360f*ringProgress,false,paint);

                  float angle=(float)Math.toRadians(-90f+360f*ringProgress);
                  float hx=cx+(float)Math.cos(angle)*r;
                  float hy=cy+(float)Math.sin(angle)*r;
                  paint.setStyle(Paint.Style.FILL);
                  paint.setColor(Color.WHITE);
                  paint.setShadowLayer(20f,0,0,Color.rgb(255,195,20));
                  canvas.drawCircle(hx,hy,6f,paint);
                  paint.clearShadowLayer();
                }

                // Outer halo appears after the main ring.
                float outer=ease(clamp((elapsed-0.72f)/0.85f));
                if(outer>0f){
                  paint.setStyle(Paint.Style.STROKE);
                  paint.setStrokeWidth(1.6f);
                  paint.setColor(Color.argb((int)(145*outer),255,224,110));
                  canvas.drawCircle(cx,cy,Math.min(w,h)*0.285f*outer,paint);
                }

                // 3) Gold particles are pulled into orbit.
                float particles=ease(clamp((elapsed-0.82f)/0.95f));
                paint.setStyle(Paint.Style.FILL);
                for(int i=0;i<ps.length;i++){
                  double a=i*0.69+elapsed*(1.6+(i%5)*0.13);
                  float orbit=Math.min(w,h)*(0.14f+(i%9)*0.018f);
                  float x=cx+(float)Math.cos(a)*orbit;
                  float y=cy+(float)Math.sin(a)*orbit;
                  float twinkle=0.45f+0.55f*(float)Math.abs(Math.sin(a*1.9));
                  int alpha=(int)(175*particles*twinkle);
                  paint.setColor(Color.argb(alpha,255,193,7));
                  canvas.drawCircle(x,y,ps[i]*particles,paint);
                }

                // Radiating gold rays behind the logo.
                float ray=ease(clamp((elapsed-1.08f)/0.78f));
                paint.setStyle(Paint.Style.STROKE);
                paint.setStrokeWidth(2f);
                paint.setColor(Color.argb((int)(58*ray),255,193,7));
                for(int i=0;i<20;i++){
                  double a=i*Math.PI*2/20.0+elapsed*0.35;
                  float inner=Math.min(w,h)*0.18f;
                  float rayOuter=inner+Math.min(w,h)*(0.09f+0.08f*ray);
                  canvas.drawLine(cx+(float)Math.cos(a)*inner,cy+(float)Math.sin(a)*inner,
                    cx+(float)Math.cos(a)*rayOuter,cy+(float)Math.sin(a)*rayOuter,paint);
                }

                // 4) Brief gold flash behind the logo reveal.
                float flash=clamp((elapsed-1.20f)/0.58f);
                if(flash>0f && flash<1f){
                  float a=(float)Math.sin(Math.PI*flash);
                  paint.setStyle(Paint.Style.FILL);
                  paint.setColor(Color.argb((int)(28*a),255,196,20));
                  canvas.drawCircle(cx,cy,Math.min(w,h)*0.26f,paint);
                }

                // 5) Small premium loading animation appears before launch.
                if(elapsed>1.82f && elapsed<2.62f){
                  drawLoading(canvas,cx,cy+Math.min(w,h)*0.285f,1f,elapsed);
                }

                // Final gold sweep before entering the store.
                if(elapsed>2.45f && elapsed<2.82f){
                  float q=ease(clamp((elapsed-2.45f)/0.37f));
                  paint.setStyle(Paint.Style.FILL);
                  paint.setColor(Color.argb((int)(150*q),255,193,7));
                  canvas.drawRect(0,h*(1f-q),w,h*(1f-q)+Math.max(3f,h*0.12f),paint);
                }

                if(elapsed<2.82f) postInvalidateDelayed(16);
              }
            }

              @Override protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              showIntro();
            }

            private void showIntro() {
              FrameLayout splash=new FrameLayout(this);
              splash.setBackgroundColor(Color.rgb(62,34,3));
              splash.addView(new GoldIntroView(this),new FrameLayout.LayoutParams(-1,-1));

              LinearLayout content=new LinearLayout(this);
              content.setOrientation(LinearLayout.VERTICAL);
              content.setGravity(Gravity.CENTER);
              content.setPadding(32,32,32,32);

              ImageView logo=new ImageView(this);
              logo.setImageResource(com.camxd.store.R.drawable.camxd_logo);
              logo.setScaleType(ImageView.ScaleType.CENTER_INSIDE);
               logo.setPadding(14,14,14,14);
              logo.setAlpha(0f);
              logo.setScaleX(0.12f);
              logo.setScaleY(0.12f);

              TextView title=new TextView(this);
              title.setText("CAMXD STORE");
              title.setTextColor(Color.rgb(255,208,0));
              title.setTextSize(27);
              title.setTypeface(Typeface.DEFAULT,Typeface.BOLD);
              title.setGravity(Gravity.CENTER);
              title.setAlpha(0f);

              TextView tagline=new TextView(this);
              tagline.setText("DIGITAL STORE  •  CEPAT  •  AMAN");
              tagline.setTextColor(Color.WHITE);
              tagline.setTextSize(12);
              tagline.setGravity(Gravity.CENTER);
              tagline.setAlpha(0f);

              LinearLayout.LayoutParams lpLogo=new LinearLayout.LayoutParams(330,330);
              content.addView(logo,lpLogo);
              LinearLayout.LayoutParams lpTitle=new LinearLayout.LayoutParams(-1,-2);
              lpTitle.topMargin=0;
              content.addView(title,lpTitle);
              LinearLayout.LayoutParams lpTag=new LinearLayout.LayoutParams(-1,-2);
              lpTag.topMargin=5;
              content.addView(tagline,lpTag);

              TextView loadingText=new TextView(this);
              loadingText.setText("MEMUAT CAMXD STORE");
              loadingText.setTextColor(Color.rgb(255,205,35));
              loadingText.setTextSize(11);
              loadingText.setLetterSpacing(0.08f);
              loadingText.setGravity(Gravity.CENTER);
              loadingText.setAlpha(0f);
              LinearLayout.LayoutParams lpLoadingText=new LinearLayout.LayoutParams(-1,-2);
              lpLoadingText.topMargin=18;
              content.addView(loadingText,lpLoadingText);

              ProgressBar loadingBar=new ProgressBar(this,null,android.R.attr.progressBarStyleHorizontal);
              loadingBar.setMax(100);
              loadingBar.setProgress(0);
              loadingBar.setIndeterminate(false);
              loadingBar.setProgressTintList(ColorStateList.valueOf(Color.rgb(255,193,7)));
              loadingBar.setAlpha(0f);
              LinearLayout.LayoutParams lpBar=new LinearLayout.LayoutParams(190,7);
              lpBar.topMargin=9;
              content.addView(loadingBar,lpBar);

              FrameLayout.LayoutParams cp=new FrameLayout.LayoutParams(-1,-2,Gravity.CENTER);
              splash.addView(content,cp);
              setContentView(splash);

              // Keep the logo exactly at the visual center of the main gold ring.
              splash.getViewTreeObserver().addOnGlobalLayoutListener(() -> {
                float ringCenterY=splash.getHeight()*0.405f;
                float logoCenterY=content.getY()+logo.getY()+logo.getHeight()/2f;
                logo.setTranslationY(ringCenterY-logoCenterY);
              });

              // Reveal sequence: flare -> ring -> particles -> logo -> title -> tagline.
              logo.animate().alpha(1f).scaleX(1f).scaleY(1f)
                .setStartDelay(760).setDuration(900)
                .withEndAction(() -> {
                  logo.animate().scaleX(1.035f).scaleY(1.035f).setDuration(180)
                    .withEndAction(() -> {
                      logo.animate().scaleX(1f).scaleY(1f).setDuration(180).start();
                      ObjectAnimator twinkle=ObjectAnimator.ofFloat(logo,"alpha",1f,0.72f,1f,0.84f,1f);
                      twinkle.setStartDelay(180);
                      twinkle.setDuration(900);
                      twinkle.setRepeatCount(3);
                      twinkle.setRepeatMode(ObjectAnimator.RESTART);
                      twinkle.start();
                    }).start();
                })
                .setInterpolator(new AccelerateDecelerateInterpolator()).start();
              title.animate().alpha(1f)
                .setStartDelay(1420).setDuration(480).start();
              tagline.animate().alpha(1f)
                .setStartDelay(1690).setDuration(420).start();
              loadingText.animate().alpha(1f).setStartDelay(1900).setDuration(350).start();
              loadingBar.animate().alpha(1f).setStartDelay(1900).setDuration(350).start();
              ObjectAnimator progress=ObjectAnimator.ofInt(loadingBar,"progress",0,100);
              progress.setStartDelay(1950);
              progress.setDuration(3000);
              progress.start();

              // Gold shimmer across the title.
              title.postDelayed(() -> {
                title.setShadowLayer(18f,0,0,Color.rgb(255,180,0));
                title.postDelayed(() -> title.setShadowLayer(0f,0,0,Color.TRANSPARENT),320);
              }, 1950);

              playIntroSound();

              new Handler().postDelayed(() -> setupWebView(),5600);
            }

              private void playIntroSound() {
              final int sr=44100;
              final int total=sr*2;
              final short[] samples=new short[total];
              double[] tones={330,494,659,988};
              int[] starts={0,420,780,1120};
              int[] lengths={360,360,420,700};
              for(int k=0;k<tones.length;k++){
                int from=starts[k]*sr/1000;
                int len=lengths[k]*sr/1000;
                for(int j=0;j<len && from+j<samples.length;j++){
                  double x=(double)j/len;
                  double env=Math.sin(Math.PI*Math.min(1.0,x))*Math.pow(1.0-x,0.55);
                  double wave=Math.sin(2*Math.PI*tones[k]*j/sr);
                  int v=(int)(wave*env*10500);
                  int idx=from+j;
                  int mixed=samples[idx]+v;
                  samples[idx]=(short)Math.max(Short.MIN_VALUE,Math.min(Short.MAX_VALUE,mixed));
                }
              }
              byte[] pcm=new byte[samples.length*2];
              for(int i=0;i<samples.length;i++){
                pcm[i*2]=(byte)(samples[i]&0xff);
                pcm[i*2+1]=(byte)((samples[i]>>8)&0xff);
              }
              introAudio=new AudioTrack(AudioManager.STREAM_MUSIC,sr,AudioFormat.CHANNEL_OUT_MONO,AudioFormat.ENCODING_PCM_16BIT,pcm.length,AudioTrack.MODE_STATIC);
              introAudio.write(pcm,0,pcm.length);
              introAudio.setStereoVolume(0.55f,0.55f);
              introAudio.play();
            }

            private void setupWebView() {
              if(introAudio!=null){ try{introAudio.stop();introAudio.release();}catch(Exception ignored){} introAudio=null; }
              webView=new WebView(this);
              setContentView(webView);
              WebSettings s=webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setSupportZoom(false);
              s.setBuiltInZoomControls(false);
              s.setDisplayZoomControls(false);
              s.setMediaPlaybackRequiresUserGesture(false);

              webView.setWebChromeClient(new WebChromeClient(){
                @Override public boolean onShowFileChooser(WebView view,ValueCallback<Uri[]> callback,FileChooserParams params){
                  pendingFileCallback=callback;
                  try{startActivityForResult(params.createIntent(),1001);}
                  catch(Exception e){pendingFileCallback=null;callback.onReceiveValue(null);Toast.makeText(MainActivity.this,"Tidak dapat membuka pemilih file",Toast.LENGTH_SHORT).show();}
                  return true;
                }
              });

              webView.setWebViewClient(new WebViewClient(){
                @Override public boolean shouldOverrideUrlLoading(WebView view,WebResourceRequest request){
                  String url=request.getUrl().toString();
                  if(url.startsWith("https://wa.me/")||url.startsWith("whatsapp://")){
                    try{startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse(url)));}
                    catch(Exception e){Toast.makeText(MainActivity.this,"WhatsApp tidak ditemukan",Toast.LENGTH_SHORT).show();}
                    return true;
                  }
                  if(url.endsWith(".apk")||url.contains("/downloads/")){
                    try{Intent i=new Intent(Intent.ACTION_VIEW,Uri.parse(url));i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);startActivity(i);}
                    catch(Exception e){Toast.makeText(MainActivity.this,"Tidak dapat membuka file APK",Toast.LENGTH_SHORT).show();}
                    return true;
                  }
                  if(url.startsWith("http://")||url.startsWith("https://")){view.loadUrl(url);return true;}
                  try{startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse(url)));}
                  catch(Exception e){Toast.makeText(MainActivity.this,"Aplikasi untuk membuka link tidak ditemukan",Toast.LENGTH_SHORT).show();}
                  return true;
                }
              });
              webView.loadUrl("https://vertifikasiakuncam-dotcom.github.io/camxd-store/?v=20261007-store-final");
            }

            @Override public void onBackPressed(){
              if(webView!=null&&webView.canGoBack()){webView.goBack();return;}
              long now=System.currentTimeMillis();
              if(now-lastBackPress<1800){super.onBackPressed();return;}
              lastBackPress=now;
              Toast.makeText(this,"Tekan sekali lagi untuk keluar",Toast.LENGTH_SHORT).show();
            }

            @Override public void onActivityResult(int requestCode,int resultCode,Intent data){
              if(requestCode==1001&&pendingFileCallback!=null){
                Uri[] results=null;
                if(resultCode==RESULT_OK&&data!=null&&data.getData()!=null)results=new Uri[]{data.getData()};
                pendingFileCallback.onReceiveValue(results);
                pendingFileCallback=null;
              }
              super.onActivityResult(requestCode,resultCode,data);
            }

            @Override protected void onDestroy(){
              if(pendingFileCallback!=null){pendingFileCallback.onReceiveValue(null);pendingFileCallback=null;}
              if(introAudio!=null){try{introAudio.stop();introAudio.release();}catch(Exception ignored){}introAudio=null;}
              if(webView!=null)webView.destroy();
              super.onDestroy();
            }
          }
          EOF

      - name: Build and sign
        working-directory: store-android
        shell: bash
        env:
          CAMXD_KEYSTORE_BASE64: ${{ secrets.CAMXD_KEYSTORE_BASE64 }}
          CAMXD_KEYSTORE_PASSWORD: ${{ secrets.CAMXD_KEYSTORE_PASSWORD }}
          CAMXD_KEY_PASSWORD: ${{ secrets.CAMXD_KEY_PASSWORD }}
          CAMXD_KEY_ALIAS: ${{ secrets.CAMXD_KEY_ALIAS }}
        run: |
          set -e

          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export GRADLE=/tmp/gradle-8.10.2/bin/gradle

          $GRADLE --no-daemon :app:assembleRelease

          mkdir -p ../signed

          python3 - <<'PY'
          import base64, os
          s = os.environ["CAMXD_KEYSTORE_BASE64"]
          s = "".join(s.split())
          s += "=" * ((4 - len(s) % 4) % 4)
          with open("../signed/key.jks", "wb") as f:
              f.write(base64.b64decode(s, validate=False))
          PY

          keytool -list -keystore ../signed/key.jks -storepass "$CAMXD_KEYSTORE_PASSWORD" -alias "$CAMXD_KEY_ALIAS" >/dev/null

          BT="$ANDROID_HOME/build-tools/35.0.0"

          "$BT/zipalign" -f 4             app/build/outputs/apk/release/app-release-unsigned.apk             ../signed/aligned.apk

          "$BT/apksigner" sign             --ks ../signed/key.jks             --ks-key-alias "$CAMXD_KEY_ALIAS"             --ks-pass env:CAMXD_KEYSTORE_PASSWORD             --key-pass env:CAMXD_KEY_PASSWORD             --out ../signed/CAMXD-Store.apk             ../signed/aligned.apk

          "$BT/apksigner" verify --verbose ../signed/CAMXD-Store.apk

          rm -f ../signed/key.jks ../signed/aligned.apk

      - name: Publish APK to website
        shell: bash
        run: |
          set -e
          mkdir -p downloads
          cp signed/CAMXD-Store.apk downloads/CAMXD-Store.apk

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f downloads/CAMXD-Store.apk
          if git diff --cached --quiet; then
            echo "APK tidak berubah dari file yang sudah dipublikasikan."
          else
            git commit -m "Publish CAMXD Store APK"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CAMXD-Store-APK
          path: signed/CAMXD-Store.apk
          if-no-files-found: error
          retention-days: 30
