name: Build CAMXD Store Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap paths
        run: bubblewrap updateConfig --jdkPath="$JAVA_HOME_17_X64" --androidSdkPath="$ANDROID_HOME"

      - name: Generate Android project
        shell: bash
        run: |
          set -e
          rm -rf android
          mkdir -p android

          KEYSTORE_PASSWORD="$(openssl rand -hex 24)"

          printf '%s\n' \
            'https://vertifikasiakuncam-dotcom.github.io/camxd-store/' \
            'https://vertifikasiakuncam-dotcom.github.io/camxd-store/' \
            'CAMXD Store' \
            'CAMXD' \
            'com.camxd.store' \
            '1' \
            '1.0.0' \
            'standalone' \
            'portrait' \
            'CAMXD Store' \
            'CAMXD Store' \
            'Indonesia' \
            'CAMXD Store' \
            'CAMXD Store' \
            'ID' \
            'camxd-store' \
            "$KEYSTORE_PASSWORD" \
            "$KEYSTORE_PASSWORD" \
          | bubblewrap init --manifest="https://vertifikasiakuncam-dotcom.github.io/camxd-store/manifest.webmanifest" --directory=android

      - name: Build unsigned APK and AAB
        working-directory: android
        run: bubblewrap build --skipSigning --skipPwaValidation

      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: CAMXD-Store-Android
          path: |
            android/app-release-unsigned-aligned.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
