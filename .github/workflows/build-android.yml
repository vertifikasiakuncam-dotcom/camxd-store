name: Build CAMXD Store Signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Prepare Android project
        shell: bash
        run: |
          set -e
          rm -rf android
          mkdir -p android

          cat > android/twa-manifest.json <<'EOF'
          {
            "packageId": "com.camxd.store",
            "host": "vertifikasiakuncam-dotcom.github.io",
            "name": "CAMXD Store",
            "launcherName": "CAMXD Store",
            "display": "standalone",
            "themeColor": "#ffd000",
            "themeColorDark": "#050505",
            "navigationColor": "#050505",
            "navigationColorDark": "#050505",
            "navigationDividerColor": "#050505",
            "navigationDividerColorDark": "#050505",
            "backgroundColor": "#050505",
            "startUrl": "/camxd-store/",
            "iconUrl": "https://vertifikasiakuncam-dotcom.github.io/camxd-store/camxd-logo.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "android-keystore",
              "alias": "android"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://vertifikasiakuncam-dotcom.github.io/camxd-store/manifest.webmanifest",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://vertifikasiakuncam-dotcom.github.io/camxd-store/",
            "minSdkVersion": 23,
            "orientation": "portrait-primary",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "protocolHandlers": [],
            "fileHandlers": [],
            "launchHandlerClientMode": "",
            "displayOverride": [
              "standalone"
            ],
            "appVersion": "1.0.0"
          }
          EOF

          keytool -genkeypair -v             -keystore android/android-keystore             -alias android             -storepass camxd-test-signing             -keypass camxd-test-signing             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=CAMXD Store, OU=CAMXD, O=CAMXD Store, C=ID"

      - name: Build and sign Android package
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: camxd-test-signing
          BUBBLEWRAP_KEY_PASSWORD: camxd-test-signing
        run: |
          bubblewrap build             --manifest=android             --signingKeyPath=android/android-keystore             --signingKeyAlias=android             --skipPwaValidation

      - name: Verify signed APK
        shell: bash
        run: |
          set -e
          APK="android/app-release-signed.apk"
          if [ ! -f "$APK" ]; then
            echo "Signed APK not found. Available APK files:"
            find android -type f -name "*.apk" -print
            exit 1
          fi
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CAMXD-Store-Signed-APK
          path: android/app-release-signed.apk
          if-no-files-found: error
          retention-days: 14
