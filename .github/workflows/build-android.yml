name: Build CAMXD Store Signed APK

on:
  push:
    paths:
      - "index.html"
      - "script.js"
      - "style.css"
      - "pwa.js"
      - "manifest.webmanifest"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          echo "Using sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.bubblewrap"

          # Let Bubblewrap write/validate its own config instead of relying
          # on a manually-created config that older Bubblewrap versions may reject.
          bubblewrap updateConfig --jdkPath "$JAVA_HOME_17_X64"
          bubblewrap updateConfig --androidSdkPath "$ANDROID_HOME"
          bubblewrap doctor

      - name: Prepare TWA project
        shell: bash
        run: |
          set -e
          rm -rf android
          mkdir -p android

          cat > android/twa-manifest.json <<'EOF'
          {
            "packageId": "com.camxd.store",
            "host": "vertifikasiakuncam-dotcom.github.io",
            "name": "CAMXD Store",
            "launcherName": "CAMXD Store",
            "display": "standalone",
            "themeColor": "#ffd000",
            "themeColorDark": "#050505",
            "navigationColor": "#050505",
            "navigationColorDark": "#050505",
            "navigationDividerColor": "#050505",
            "navigationDividerColorDark": "#050505",
            "backgroundColor": "#050505",
            "startUrl": "/camxd-store/",
            "iconUrl": "https://vertifikasiakuncam-dotcom.github.io/camxd-store/camxd-logo.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "android-keystore",
              "alias": "android"
            },
            "appVersionName": "1.0.2",
            "appVersionCode": 3,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://vertifikasiakuncam-dotcom.github.io/camxd-store/manifest.webmanifest",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://vertifikasiakuncam-dotcom.github.io/camxd-store/",
            "minSdkVersion": 23,
            "orientation": "portrait-primary",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "protocolHandlers": [],
            "fileHandlers": [],
            "launchHandlerClientMode": "",
            "displayOverride": [
              "standalone"
            ],
            "appVersion": "1.0.2"
          }
          EOF

          SIGN_PASS="$(openssl rand -hex 16)"
          echo "SIGN_PASS=$SIGN_PASS" >> "$GITHUB_ENV"

          keytool -genkeypair -v             -keystore android/android-keystore             -alias android             -storepass "$SIGN_PASS"             -keypass "$SIGN_PASS"             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=CAMXD Store, OU=CAMXD, O=CAMXD Store, C=ID"

      - name: Build with official Bubblewrap
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.SIGN_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.SIGN_PASS }}
        run: |
          set -e
          bubblewrap build             --manifest=android             --signingKeyPath=android/android-keystore             --signingKeyAlias=android             --skipPwaValidation

      - name: Verify with Android apksigner
        shell: bash
        run: |
          set -e
          APK="android/app-release-signed.apk"
          test -f "$APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: Publish APK to website
        shell: bash
        run: |
          set -e
          mkdir -p downloads
          cp android/app-release-signed.apk downloads/CAMXD-Store.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/CAMXD-Store.apk
          if git diff --cached --quiet; then
            echo "APK tidak berubah."
          else
            git commit -m "Publish CAMXD Store APK"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CAMXD-Store-Signed-APK
          path: android/app-release-signed.apk
          if-no-files-found: error
          retention-days: 14
