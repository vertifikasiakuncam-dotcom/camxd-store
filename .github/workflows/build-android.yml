name: Build CAMXD Store Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p android
          printf '%s\n' \
            'https://vertifikasiakuncam-dotcom.github.io/camxd-store/' \
            'https://vertifikasiakuncam-dotcom.github.io/camxd-store/' \
            'CAMXD Store' \
            'CAMXD' \
            'com.camxd.store' \
            '1' \
            '1.0.0' \
            'standalone' \
            'portrait' \
            'CAMXD Store' \
            'CAMXD Store' \
            'Indonesia' \
            'CAMXD Store' \
            'CAMXD Store' \
            'ID' \
            'camxd-store' \
            'camxd-store-password-2026' \
            'camxd-store-password-2026' \
          | bubblewrap init --manifest="https://vertifikasiakuncam-dotcom.github.io/camxd-store/manifest.webmanifest" --directory=android

      - name: Build unsigned APK and AAB
        working-directory: android
        run: bubblewrap build --skipSigning --skipPwaValidation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CAMXD-Store-Android
          path: |
            android/app-release-unsigned-aligned.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
