name: Build CAMXD Store Signed APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "script.js"
      - "style.css"
      - "pwa.js"
      - "manifest.webmanifest"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          echo "Using sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create native Android WebView project
        shell: bash
        run: |
          set -e
          rm -rf store-android
          mkdir -p store-android/app/src/main/java/com/camxd/store
          mkdir -p store-android/app/src/main/res/values
          mkdir -p store-android/app/src/main/res/values-v31
          mkdir -p store-android/app/src/main/res/drawable-nodpi

          cp camxd-logo.png store-android/app/src/main/res/drawable-nodpi/camxd_logo.png

          cat > store-android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name="CAMXDStore"
          include(":app")
          EOF

          cat > store-android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          cat > store-android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.camxd.store'
            compileSdk 35
            defaultConfig {
              applicationId 'com.camxd.store'
              minSdk 23
              targetSdk 35
              versionCode 2
              versionName '1.0.1'
            }
          }
          EOF

          cat > store-android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#ffd000</item>
              <item name="android:statusBarColor">#080808</item>
              <item name="android:navigationBarColor">#050505</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowBackground">#080808</item>
            </style>
          </resources>
          EOF

          cat > store-android/app/src/main/res/values-v31/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#ffd000</item>
              <item name="android:statusBarColor">#080808</item>
              <item name="android:navigationBarColor">#050505</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowBackground">#080808</item>
              <item name="android:windowSplashScreenBackground">#080808</item>
              <item name="android:windowSplashScreenAnimatedIcon">@drawable/camxd_logo</item>
              <item name="android:windowSplashScreenAnimationDuration">500</item>
            </style>
          </resources>
          EOF

          cat > store-android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application
              android:theme="@style/AppTheme"
              android:label="CAMXD STORE"
              android:icon="@drawable/camxd_logo"
              android:allowBackup="false"
              android:usesCleartextTraffic="false">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:screenOrientation="portrait">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > store-android/app/src/main/java/com/camxd/store/MainActivity.java <<'EOF'
          package com.camxd.store;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.Typeface;
          import android.media.AudioFormat;
          import android.media.AudioManager;
          import android.media.AudioTrack;
          import android.view.Gravity;
          import android.view.View;
          import android.view.animation.AccelerateDecelerateInterpolator;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.ValueCallback;
          import android.content.Intent;
          import android.net.Uri;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.Random;

          public class MainActivity extends Activity {
            private WebView webView;
            private long lastBackPress = 0;
            private ValueCallback<Uri[]> pendingFileCallback;
            private AudioTrack introAudio;

            private static class GoldIntroView extends View {
              private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Random random = new Random(2026);
              private final float[] ps = new float[54];
              private final long startedAt = System.currentTimeMillis();

              GoldIntroView(android.content.Context context) {
                super(context);
                setLayerType(View.LAYER_TYPE_SOFTWARE, null);
                for(int i=0;i<ps.length;i++) ps[i]=1.2f+random.nextFloat()*3.8f;
              }

              private void drawCloud(Canvas canvas,float x,float y,float scale){
                canvas.drawOval(new RectF(x,y,x+170f*scale,y+38f*scale),paint);
                canvas.drawCircle(x+48f*scale,y,30f*scale,paint);
                canvas.drawCircle(x+92f*scale,y-12f*scale,42f*scale,paint);
                canvas.drawCircle(x+132f*scale,y+2f*scale,27f*scale,paint);
              }

              private float clamp(float x){ return Math.max(0f,Math.min(1f,x)); }
              private float ease(float x){
                x=clamp(x);
                return x*x*(3f-2f*x);
              }

              @Override protected void onDraw(Canvas canvas) {
                float w=getWidth(), h=getHeight();
                float elapsed=(System.currentTimeMillis()-startedAt)/1000f;
                float cx=w/2f, cy=h*0.405f;
                canvas.drawColor(Color.rgb(2,2,2));

                // Soft drifting clouds for the premium sky atmosphere.
                float cloudPhase=clamp((elapsed-0.05f)/2.5f);
                paint.setStyle(Paint.Style.FILL);
                paint.setColor(Color.argb(34,255,255,255));
                paint.setShadowLayer(22f,0,0,Color.argb(35,255,210,90));
                float drift=(elapsed*42f)% (w+260f);
                drawCloud(canvas,-170f+drift,h*0.25f,1.0f);
                drawCloud(canvas,w+120f-drift*0.72f,h*0.57f,0.72f);
                drawCloud(canvas,-260f+((drift*0.48f)%(w+420f)),h*0.72f,0.55f);
                paint.clearShadowLayer();

                // 1) Gold flare is born from a single point.
                float flare=ease(clamp(elapsed/0.42f));
                if(elapsed<0.75f){
                  float radius=Math.min(w,h)*(0.012f+0.22f*flare);
                  paint.setStyle(Paint.Style.FILL);
                  paint.setColor(Color.argb((int)(235*(1f-flare*0.55f)),255,205,45));
                  paint.setShadowLayer(42f*flare,0,0,Color.rgb(255,170,0));
                  canvas.drawCircle(cx,cy,radius,paint);
                  paint.clearShadowLayer();
                }

                // 2) A bright gold light draws the ring around the logo.
                float ringProgress=ease(clamp((elapsed-0.28f)/0.92f));
                if(ringProgress>0f){
                  float r=Math.min(w,h)*0.205f;
                  paint.setStyle(Paint.Style.STROKE);
                  paint.setStrokeWidth(5.5f);
                  paint.setColor(Color.argb(235,255,193,7));
                  paint.setShadowLayer(26f,0,0,Color.rgb(255,168,0));
                  RectF oval=new RectF(cx-r,cy-r,cx+r,cy+r);
                  canvas.drawArc(oval,-90f,360f*ringProgress,false,paint);

                  float angle=(float)Math.toRadians(-90f+360f*ringProgress);
                  float hx=cx+(float)Math.cos(angle)*r;
                  float hy=cy+(float)Math.sin(angle)*r;
                  paint.setStyle(Paint.Style.FILL);
                  paint.setColor(Color.WHITE);
                  paint.setShadowLayer(20f,0,0,Color.rgb(255,195,20));
                  canvas.drawCircle(hx,hy,6f,paint);
                  paint.clearShadowLayer();
                }

                // Outer halo appears after the main ring.
                float outer=ease(clamp((elapsed-0.72f)/0.85f));
                if(outer>0f){
                  paint.setStyle(Paint.Style.STROKE);
                  paint.setStrokeWidth(1.6f);
                  paint.setColor(Color.argb((int)(145*outer),255,224,110));
                  canvas.drawCircle(cx,cy,Math.min(w,h)*0.285f*outer,paint);
                }

                // 3) Gold particles are pulled into orbit.
                float particles=ease(clamp((elapsed-0.82f)/0.95f));
                paint.setStyle(Paint.Style.FILL);
                for(int i=0;i<ps.length;i++){
                  double a=i*0.69+elapsed*(1.6+(i%5)*0.13);
                  float orbit=Math.min(w,h)*(0.14f+(i%9)*0.018f);
                  float x=cx+(float)Math.cos(a)*orbit;
                  float y=cy+(float)Math.sin(a)*orbit;
                  float twinkle=0.45f+0.55f*(float)Math.abs(Math.sin(a*1.9));
                  int alpha=(int)(175*particles*twinkle);
                  paint.setColor(Color.argb(alpha,255,193,7));
                  canvas.drawCircle(x,y,ps[i]*particles,paint);
                }

                // 4) Brief gold flash behind the logo reveal.
                float flash=clamp((elapsed-1.20f)/0.58f);
                if(flash>0f && flash<1f){
                  float a=(float)Math.sin(Math.PI*flash);
                  paint.setStyle(Paint.Style.FILL);
                  paint.setColor(Color.argb((int)(28*a),255,196,20));
                  canvas.drawCircle(cx,cy,Math.min(w,h)*0.26f,paint);
                }

                if(elapsed<2.55f) postInvalidateDelayed(16);
              }
            }

              @Override protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              showIntro();
            }

            private void showIntro() {
              FrameLayout splash=new FrameLayout(this);
              splash.setBackgroundColor(Color.BLACK);
              splash.addView(new GoldIntroView(this),new FrameLayout.LayoutParams(-1,-1));

              LinearLayout content=new LinearLayout(this);
              content.setOrientation(LinearLayout.VERTICAL);
              content.setGravity(Gravity.CENTER);
              content.setPadding(32,32,32,32);

              ImageView logo=new ImageView(this);
              logo.setImageResource(com.camxd.store.R.drawable.camxd_logo);
              logo.setScaleType(ImageView.ScaleType.CENTER_INSIDE);
              logo.setAlpha(0f);
              logo.setScaleX(0.30f);
              logo.setScaleY(0.30f);

              TextView title=new TextView(this);
              title.setText("CAMXD STORE");
              title.setTextColor(Color.rgb(255,208,0));
              title.setTextSize(27);
              title.setTypeface(Typeface.DEFAULT,Typeface.BOLD);
              title.setGravity(Gravity.CENTER);
              title.setAlpha(0f);

              TextView tagline=new TextView(this);
              tagline.setText("DIGITAL STORE  •  CEPAT  •  AMAN");
              tagline.setTextColor(Color.WHITE);
              tagline.setTextSize(12);
              tagline.setGravity(Gravity.CENTER);
              tagline.setAlpha(0f);

              LinearLayout.LayoutParams lpLogo=new LinearLayout.LayoutParams(280,280);
              content.addView(logo,lpLogo);
              LinearLayout.LayoutParams lpTitle=new LinearLayout.LayoutParams(-1,-2);
              lpTitle.topMargin=8;
              content.addView(title,lpTitle);
              LinearLayout.LayoutParams lpTag=new LinearLayout.LayoutParams(-1,-2);
              lpTag.topMargin=7;
              content.addView(tagline,lpTag);

              FrameLayout.LayoutParams cp=new FrameLayout.LayoutParams(-1,-2,Gravity.CENTER);
              splash.addView(content,cp);
              setContentView(splash);

              // Reveal sequence: flare -> ring -> particles -> logo -> title -> tagline.
              logo.animate().alpha(1f).scaleX(1f).scaleY(1f)
                .setStartDelay(820).setDuration(650)
                .setInterpolator(new AccelerateDecelerateInterpolator()).start();
              title.animate().alpha(1f)
                .setStartDelay(1420).setDuration(480).start();
              tagline.animate().alpha(1f)
                .setStartDelay(1690).setDuration(420).start();

              playIntroSound();

              new Handler().postDelayed(() -> setupWebView(),2700);
            }

              private void playIntroSound() {
              final int sr=44100;
              final int total=sr*2;
              final short[] samples=new short[total];
              double[] tones={330,494,659,988};
              int[] starts={0,420,780,1120};
              int[] lengths={360,360,420,700};
              for(int k=0;k<tones.length;k++){
                int from=starts[k]*sr/1000;
                int len=lengths[k]*sr/1000;
                for(int j=0;j<len && from+j<samples.length;j++){
                  double x=(double)j/len;
                  double env=Math.sin(Math.PI*Math.min(1.0,x))*Math.pow(1.0-x,0.55);
                  double wave=Math.sin(2*Math.PI*tones[k]*j/sr);
                  int v=(int)(wave*env*10500);
                  int idx=from+j;
                  int mixed=samples[idx]+v;
                  samples[idx]=(short)Math.max(Short.MIN_VALUE,Math.min(Short.MAX_VALUE,mixed));
                }
              }
              byte[] pcm=new byte[samples.length*2];
              for(int i=0;i<samples.length;i++){
                pcm[i*2]=(byte)(samples[i]&0xff);
                pcm[i*2+1]=(byte)((samples[i]>>8)&0xff);
              }
              introAudio=new AudioTrack(AudioManager.STREAM_MUSIC,sr,AudioFormat.CHANNEL_OUT_MONO,AudioFormat.ENCODING_PCM_16BIT,pcm.length,AudioTrack.MODE_STATIC);
              introAudio.write(pcm,0,pcm.length);
              introAudio.setStereoVolume(0.55f,0.55f);
              introAudio.play();
            }

            private void setupWebView() {
              if(introAudio!=null){ try{introAudio.stop();introAudio.release();}catch(Exception ignored){} introAudio=null; }
              webView=new WebView(this);
              setContentView(webView);
              WebSettings s=webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setSupportZoom(false);
              s.setBuiltInZoomControls(false);
              s.setDisplayZoomControls(false);
              s.setMediaPlaybackRequiresUserGesture(false);

              webView.setWebChromeClient(new WebChromeClient(){
                @Override public boolean onShowFileChooser(WebView view,ValueCallback<Uri[]> callback,FileChooserParams params){
                  pendingFileCallback=callback;
                  try{startActivityForResult(params.createIntent(),1001);}
                  catch(Exception e){pendingFileCallback=null;callback.onReceiveValue(null);Toast.makeText(MainActivity.this,"Tidak dapat membuka pemilih file",Toast.LENGTH_SHORT).show();}
                  return true;
                }
              });

              webView.setWebViewClient(new WebViewClient(){
                @Override public boolean shouldOverrideUrlLoading(WebView view,WebResourceRequest request){
                  String url=request.getUrl().toString();
                  if(url.startsWith("https://wa.me/")||url.startsWith("whatsapp://")){
                    try{startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse(url)));}
                    catch(Exception e){Toast.makeText(MainActivity.this,"WhatsApp tidak ditemukan",Toast.LENGTH_SHORT).show();}
                    return true;
                  }
                  if(url.endsWith(".apk")||url.contains("/downloads/")){
                    try{Intent i=new Intent(Intent.ACTION_VIEW,Uri.parse(url));i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);startActivity(i);}
                    catch(Exception e){Toast.makeText(MainActivity.this,"Tidak dapat membuka file APK",Toast.LENGTH_SHORT).show();}
                    return true;
                  }
                  if(url.startsWith("http://")||url.startsWith("https://")){view.loadUrl(url);return true;}
                  try{startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse(url)));}
                  catch(Exception e){Toast.makeText(MainActivity.this,"Aplikasi untuk membuka link tidak ditemukan",Toast.LENGTH_SHORT).show();}
                  return true;
                }
              });
              webView.loadUrl("https://vertifikasiakuncam-dotcom.github.io/camxd-store/?v=20261007-store-final");
            }

            @Override public void onBackPressed(){
              if(webView!=null&&webView.canGoBack()){webView.goBack();return;}
              long now=System.currentTimeMillis();
              if(now-lastBackPress<1800){super.onBackPressed();return;}
              lastBackPress=now;
              Toast.makeText(this,"Tekan sekali lagi untuk keluar",Toast.LENGTH_SHORT).show();
            }

            @Override public void onActivityResult(int requestCode,int resultCode,Intent data){
              if(requestCode==1001&&pendingFileCallback!=null){
                Uri[] results=null;
                if(resultCode==RESULT_OK&&data!=null&&data.getData()!=null)results=new Uri[]{data.getData()};
                pendingFileCallback.onReceiveValue(results);
                pendingFileCallback=null;
              }
              super.onActivityResult(requestCode,resultCode,data);
            }

            @Override protected void onDestroy(){
              if(pendingFileCallback!=null){pendingFileCallback.onReceiveValue(null);pendingFileCallback=null;}
              if(introAudio!=null){try{introAudio.stop();introAudio.release();}catch(Exception ignored){}introAudio=null;}
              if(webView!=null)webView.destroy();
              super.onDestroy();
            }
          }
          EOF

      - name: Build and sign
        working-directory: store-android
        shell: bash
        env:
          CAMXD_KEYSTORE_BASE64: ${{ secrets.CAMXD_KEYSTORE_BASE64 }}
          CAMXD_KEYSTORE_PASSWORD: ${{ secrets.CAMXD_KEYSTORE_PASSWORD }}
          CAMXD_KEY_PASSWORD: ${{ secrets.CAMXD_KEY_PASSWORD }}
          CAMXD_KEY_ALIAS: ${{ secrets.CAMXD_KEY_ALIAS }}
        run: |
          set -e

          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export GRADLE=/tmp/gradle-8.10.2/bin/gradle

          $GRADLE --no-daemon :app:assembleRelease

          mkdir -p ../signed

          python3 - <<'PY'
          import base64, os
          s = os.environ["CAMXD_KEYSTORE_BASE64"]
          s = "".join(s.split())
          s += "=" * ((4 - len(s) % 4) % 4)
          with open("../signed/key.jks", "wb") as f:
              f.write(base64.b64decode(s, validate=False))
          PY

          keytool -list -keystore ../signed/key.jks -storepass "$CAMXD_KEYSTORE_PASSWORD" -alias "$CAMXD_KEY_ALIAS" >/dev/null

          BT="$ANDROID_HOME/build-tools/35.0.0"

          "$BT/zipalign" -f 4             app/build/outputs/apk/release/app-release-unsigned.apk             ../signed/aligned.apk

          "$BT/apksigner" sign             --ks ../signed/key.jks             --ks-key-alias "$CAMXD_KEY_ALIAS"             --ks-pass env:CAMXD_KEYSTORE_PASSWORD             --key-pass env:CAMXD_KEY_PASSWORD             --out ../signed/CAMXD-Store.apk             ../signed/aligned.apk

          "$BT/apksigner" verify --verbose ../signed/CAMXD-Store.apk

          rm -f ../signed/key.jks ../signed/aligned.apk

      - name: Publish APK to website
        shell: bash
        run: |
          set -e
          mkdir -p downloads
          cp signed/CAMXD-Store.apk downloads/CAMXD-Store.apk

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f downloads/CAMXD-Store.apk
          if git diff --cached --quiet; then
            echo "APK tidak berubah dari file yang sudah dipublikasikan."
          else
            git commit -m "Publish CAMXD Store APK"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CAMXD-Store-APK
          path: signed/CAMXD-Store.apk
          if-no-files-found: error
          retention-days: 30
