name: Build CAMXD Store Signed APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "script.js"
      - "style.css"
      - "pwa.js"
      - "manifest.webmanifest"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          echo "Using sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create native Android WebView project
        shell: bash
        run: |
          set -e
          rm -rf store-android
          mkdir -p store-android/app/src/main/java/com/camxd/store
          mkdir -p store-android/app/src/main/res/values
          mkdir -p store-android/app/src/main/res/values-v31
          mkdir -p store-android/app/src/main/res/drawable-nodpi

          cp camxd-logo.png store-android/app/src/main/res/drawable-nodpi/camxd_logo.png

          cat > store-android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name="CAMXDStore"
          include(":app")
          EOF

          cat > store-android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          cat > store-android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.camxd.store'
            compileSdk 35
            defaultConfig {
              applicationId 'com.camxd.store'
              minSdk 23
              targetSdk 35
              versionCode 2
              versionName '1.0.1'
            }
          }
          EOF

          cat > store-android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#ffd000</item>
              <item name="android:statusBarColor">#050505</item>
              <item name="android:navigationBarColor">#050505</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowBackground">#ffffff</item>
            </style>
          </resources>
          EOF

          cat > store-android/app/src/main/res/values-v31/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#ffd000</item>
              <item name="android:statusBarColor">#080808</item>
              <item name="android:navigationBarColor">#050505</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowBackground">#211400</item>
              <item name="android:windowSplashScreenBackground">#ffffff</item>
              <item name="android:windowSplashScreenAnimationDuration">0</item>
            </style>
          </resources>
          EOF

          cat > store-android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application
              android:theme="@style/AppTheme"
              android:label="CAMXD STORE"
              android:icon="@drawable/camxd_logo"
              android:allowBackup="false"
              android:usesCleartextTraffic="false">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:screenOrientation="portrait">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > store-android/app/src/main/java/com/camxd/store/MainActivity.java <<'EOF'
          package com.camxd.store;
          
          import android.app.Activity;
          import android.os.Bundle;
          import android.net.Uri;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.LinearGradient;
          import android.graphics.Shader;
          import android.view.View;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          
          public class MainActivity extends Activity {
            private WebView webView;
            private ValueCallback<Uri[]> pendingFileCallback;
            private long lastBackPress=0;
          
            @Override protected void onCreate(Bundle savedInstanceState){
              super.onCreate(savedInstanceState);
              getWindow().setStatusBarColor(Color.rgb(35,14,2));
              getWindow().setNavigationBarColor(Color.rgb(18,7,1));
              showIntro();
            }
          
            private void showIntro(){
              setContentView(new StaticIntroView());
            }
          
            private final class StaticIntroView extends View {
              private final Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint textPaint=new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Bitmap logo;
              private final long startTime=System.currentTimeMillis();
              private final long duration=4800L;
          
              StaticIntroView(){
                super(MainActivity.this);
                logo=BitmapFactory.decodeResource(getResources(),R.drawable.camxd_logo);
                textPaint.setTypeface(android.graphics.Typeface.create("sans",android.graphics.Typeface.BOLD));
                setBackgroundColor(Color.rgb(35,12,2));
                postInvalidateOnAnimation();
              }
          
              @Override protected void onDraw(Canvas c){
                super.onDraw(c);
                final float w=getWidth(), h=getHeight();
          
                // Static premium gold/brown background. No cloud or logo animation.
                p.setStyle(Paint.Style.FILL);
                p.setShader(new LinearGradient(0,0,0,h,
                    Color.rgb(48,18,2),Color.rgb(156,58,3),Shader.TileMode.CLAMP));
                c.drawRect(0,0,w,h,p);
                p.setShader(null);
          
                // Static soft golden glow behind the logo.
                p.setColor(Color.argb(55,255,188,35));
                c.drawCircle(w/2f,h*0.43f,w*0.42f,p);
                p.setColor(Color.argb(30,255,225,120));
                c.drawCircle(w/2f,h*0.43f,w*0.30f,p);
          
                // Static subtle sun rays.
                p.setStrokeWidth(3f);
                p.setColor(Color.argb(65,255,196,45));
                float cx=w/2f, cy=h*0.43f;
                for(int i=-6;i<=6;i++){
                  float tx=cx+i*w*0.14f;
                  c.drawLine(cx,cy,tx,cy-h*0.24f,p);
                }
          
                // Logo stays completely still and fully contained.
                float maxW=w*0.78f;
                float maxH=h*0.40f;
                float scale=Math.min(maxW/logo.getWidth(),maxH/logo.getHeight());
                float lw=logo.getWidth()*scale;
                float lh=logo.getHeight()*scale;
                float logoLeft=(w-lw)/2f;
                float logoTop=h*0.18f;
                p.setAlpha(255);
                c.drawBitmap(logo,null,new RectF(logoLeft,logoTop,logoLeft+lw,logoTop+lh),p);
          
                drawTextCentered(c,"DIGITAL STORE • CEPAT • AMAN",logoTop+lh+42f,16f,Color.WHITE);
                drawTextCentered(c,"CAMXD STORE",logoTop+lh+88f,30f,Color.rgb(255,218,72));
          
                // Only the loading fill moves.
                float t=Math.min(1f,(System.currentTimeMillis()-startTime)/(float)duration);
                float barW=Math.min(w*0.72f,560f);
                float barH=22f;
                float barX=(w-barW)/2f;
                float barY=logoTop+lh+122f;
          
                p.setStyle(Paint.Style.FILL);
                p.setColor(Color.argb(220,30,12,2));
                c.drawRoundRect(new RectF(barX,barY,barX+barW,barY+barH),barH/2f,barH/2f,p);
          
                p.setStyle(Paint.Style.STROKE);
                p.setStrokeWidth(3f);
                p.setColor(Color.rgb(255,190,25));
                c.drawRoundRect(new RectF(barX,barY,barX+barW,barY+barH),barH/2f,barH/2f,p);
          
                p.setStyle(Paint.Style.FILL);
                p.setShader(new LinearGradient(barX,0,barX+barW,0,
                    Color.rgb(255,170,0),Color.rgb(255,244,150),Shader.TileMode.CLAMP));
                c.drawRoundRect(new RectF(barX+3,barY+3,
                    barX+3+(barW-6)*t,barY+barH-3),9,9,p);
                p.setShader(null);
          
                drawTextCentered(c,"MEMUAT CAMXD STORE",barY+48f,12f,Color.rgb(255,226,112));
          
                if(t<1f){
                  postInvalidateOnAnimation();
                }else{
                  postDelayed(() -> setupWebView(),180);
                }
              }
          
              private void drawTextCentered(Canvas c,String s,float y,float size,int color){
                textPaint.setTextSize(size);
                textPaint.setTextAlign(Paint.Align.CENTER);
                textPaint.setColor(color);
                c.drawText(s,getWidth()/2f,y,textPaint);
              }
            }
          
            private void setupWebView(){
              webView=new WebView(this);
              setContentView(webView);
          
              WebSettings s=webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setSupportZoom(false);
              s.setBuiltInZoomControls(false);
              s.setDisplayZoomControls(false);
              s.setMediaPlaybackRequiresUserGesture(false);
          
              webView.setWebChromeClient(new WebChromeClient(){
                @Override public boolean onShowFileChooser(WebView view,ValueCallback<Uri[]> callback,FileChooserParams params){
                  pendingFileCallback=callback;
                  try{ startActivityForResult(params.createIntent(),1001); }
                  catch(Exception e){
                    pendingFileCallback=null;
                    callback.onReceiveValue(null);
                    Toast.makeText(MainActivity.this,"Tidak dapat membuka pemilih file",Toast.LENGTH_SHORT).show();
                  }
                  return true;
                }
              });
          
              webView.setWebViewClient(new WebViewClient(){
                @Override public boolean shouldOverrideUrlLoading(WebView view,WebResourceRequest request){
                  return handleUrl(view,request.getUrl().toString());
                }
                @Override public boolean shouldOverrideUrlLoading(WebView view,String url){
                  return handleUrl(view,url);
                }
              });
          
              webView.loadUrl("https://vertifikasiakuncam-dotcom.github.io/camxd-store/?v=20261007-store-final");
            }
          
            private boolean handleUrl(WebView view,String url){
              if(url.startsWith("https://wa.me/")||url.startsWith("whatsapp://")){
                try{ startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse(url))); }
                catch(Exception e){ Toast.makeText(this,"WhatsApp tidak ditemukan",Toast.LENGTH_SHORT).show(); }
                return true;
              }
              if(url.endsWith(".apk")||url.contains("/downloads/")){
                try{
                  Intent i=new Intent(Intent.ACTION_VIEW,Uri.parse(url));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  startActivity(i);
                }catch(Exception e){ Toast.makeText(this,"Tidak dapat membuka file APK",Toast.LENGTH_SHORT).show(); }
                return true;
              }
              if(url.startsWith("http://")||url.startsWith("https://")){
                view.loadUrl(url);
                return true;
              }
              try{ startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse(url))); }
              catch(Exception e){ Toast.makeText(this,"Aplikasi untuk membuka link tidak ditemukan",Toast.LENGTH_SHORT).show(); }
              return true;
            }
          
            @Override public void onBackPressed(){
              if(webView!=null&&webView.canGoBack()){ webView.goBack(); return; }
              long now=System.currentTimeMillis();
              if(now-lastBackPress<1800){ super.onBackPressed(); return; }
              lastBackPress=now;
              Toast.makeText(this,"Tekan sekali lagi untuk keluar",Toast.LENGTH_SHORT).show();
            }
          
            @Override protected void onActivityResult(int requestCode,int resultCode,Intent data){
              if(requestCode==1001&&pendingFileCallback!=null){
                Uri[] results=null;
                if(resultCode==RESULT_OK&&data!=null&&data.getData()!=null) results=new Uri[]{data.getData()};
                pendingFileCallback.onReceiveValue(results);
                pendingFileCallback=null;
              }
              super.onActivityResult(requestCode,resultCode,data);
            }
          
            @Override protected void onDestroy(){
              if(pendingFileCallback!=null){ pendingFileCallback.onReceiveValue(null); pendingFileCallback=null; }
              if(webView!=null){ webView.destroy(); webView=null; }
              super.onDestroy();
            }
          }
          EOF

      - name: Build and sign
        working-directory: store-android
        shell: bash
        env:
          CAMXD_KEYSTORE_BASE64: ${{ secrets.CAMXD_KEYSTORE_BASE64 }}
          CAMXD_KEYSTORE_PASSWORD: ${{ secrets.CAMXD_KEYSTORE_PASSWORD }}
          CAMXD_KEY_PASSWORD: ${{ secrets.CAMXD_KEY_PASSWORD }}
          CAMXD_KEY_ALIAS: ${{ secrets.CAMXD_KEY_ALIAS }}
        run: |
          set -e

          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export GRADLE=/tmp/gradle-8.10.2/bin/gradle

          $GRADLE --no-daemon :app:assembleRelease

          mkdir -p ../signed

          python3 - <<'PY'
          import base64, os
          s = os.environ["CAMXD_KEYSTORE_BASE64"]
          s = "".join(s.split())
          s += "=" * ((4 - len(s) % 4) % 4)
          with open("../signed/key.jks", "wb") as f:
              f.write(base64.b64decode(s, validate=False))
          PY

          keytool -list -keystore ../signed/key.jks -storepass "$CAMXD_KEYSTORE_PASSWORD" -alias "$CAMXD_KEY_ALIAS" >/dev/null

          BT="$ANDROID_HOME/build-tools/35.0.0"

          "$BT/zipalign" -f 4             app/build/outputs/apk/release/app-release-unsigned.apk             ../signed/aligned.apk

          "$BT/apksigner" sign             --ks ../signed/key.jks             --ks-key-alias "$CAMXD_KEY_ALIAS"             --ks-pass env:CAMXD_KEYSTORE_PASSWORD             --key-pass env:CAMXD_KEY_PASSWORD             --out ../signed/CAMXD-Store.apk             ../signed/aligned.apk

          "$BT/apksigner" verify --verbose ../signed/CAMXD-Store.apk

          rm -f ../signed/key.jks ../signed/aligned.apk

      - name: Publish APK to website
        shell: bash
        run: |
          set -e
          mkdir -p downloads
          cp signed/CAMXD-Store.apk downloads/CAMXD-Store.apk

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f downloads/CAMXD-Store.apk
          if git diff --cached --quiet; then
            echo "APK tidak berubah dari file yang sudah dipublikasikan."
          else
            git commit -m "Publish CAMXD Store APK"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CAMXD-Store-APK
          path: signed/CAMXD-Store.apk
          if-no-files-found: error
          retention-days: 30
