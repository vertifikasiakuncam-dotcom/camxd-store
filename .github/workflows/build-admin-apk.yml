name: Build CAMXD Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-admin-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          echo "Using sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Create Android project
        shell: bash
        run: |
          set -e
          rm -rf admin-android
          mkdir -p admin-android/app/src/main/java/com/camxd/admin admin-android/app/src/main/res/values admin-android/app/src/main/res/values-v31 admin-android/app/src/main/res/drawable admin-android/app/src/main/res/drawable-nodpi
          cat > admin-android/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          cat > admin-android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name="CAMXDAdmin"
          include(":app")
          EOF
          cat > admin-android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false; id 'com.google.gms.google-services' version '4.4.2' apply false }
          EOF
          cat > admin-android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
          dependencies { implementation platform('com.google.firebase:firebase-bom:34.3.0'); implementation 'com.google.firebase:firebase-messaging' }
          android { namespace 'com.camxd.admin'; compileSdk 35
            defaultConfig { applicationId 'com.camxd.admin'; minSdk 23; targetSdk 35; versionCode 5; versionName '1.0.4' }
          }
          EOF
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 512 -h 512 camxd-admin-icon.svg -o admin-android/app/src/main/res/drawable-nodpi/camxd_admin_icon.png
          cat > admin-android/app/src/main/res/drawable/splash_background.xml <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:drawable="@android:color/black"/>
            <item><bitmap android:src="@drawable/camxd_admin_icon" android:gravity="center"/></item>
          </layer-list>
          EOF
          cat > admin-android/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.NoActionBar"><item name="android:colorAccent">#ffd000</item><item name="android:statusBarColor">#080808</item><item name="android:navigationBarColor">#050505</item><item name="android:windowLightStatusBar">false</item><item name="android:windowBackground">@drawable/splash_background</item></style></resources>
          EOF
          cat > admin-android/app/src/main/res/values-v31/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.NoActionBar"><item name="android:colorAccent">#ffd000</item><item name="android:statusBarColor">#080808</item><item name="android:navigationBarColor">#050505</item><item name="android:windowLightStatusBar">false</item><item name="android:windowBackground">@drawable/splash_background</item><item name="android:windowSplashScreenBackground">#080808</item><item name="android:windowSplashScreenAnimatedIcon">@drawable/camxd_admin_icon</item><item name="android:windowSplashScreenAnimationDuration">500</item></style></resources>
          EOF
          cat > admin-android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <application android:theme="@style/AppTheme" android:label="CAMXD ADMIN" android:icon="@drawable/camxd_admin_icon" android:allowBackup="false">
              <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="camxd_admin_orders"/>
              <service android:name=".CamxdAdminFirebaseMessagingService" android:exported="false"><intent-filter><action android:name="com.google.firebase.MESSAGING_EVENT"/></intent-filter></service>
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > admin-android/app/src/main/java/com/camxd/admin/CamxdAdminFirebaseMessagingService.java <<'EOF'
          package com.camxd.admin;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.text.TextUtils;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;
          import java.util.Map;
          public class CamxdAdminFirebaseMessagingService extends FirebaseMessagingService {
            private static final String CHANNEL_ID = "camxd_admin_orders";
            @Override public void onMessageReceived(RemoteMessage message) {
              Map<String,String> data=message.getData();
              String title=data.get("title"), body=data.get("body");
              if(message.getNotification()!=null) {
                if(TextUtils.isEmpty(title)) title=message.getNotification().getTitle();
                if(TextUtils.isEmpty(body)) body=message.getNotification().getBody();
              }
              if(TextUtils.isEmpty(title)) title="CAMXD ADMIN";
              if(TextUtils.isEmpty(body)) body="Ada pesanan atau pembayaran yang perlu diperiksa.";
              NotificationManager manager=(NotificationManager)getSystemService(Context.NOTIFICATION_SERVICE);
              if(manager==null) return;
              if(Build.VERSION.SDK_INT>=Build.VERSION_CODES.O) {
                NotificationChannel channel=new NotificationChannel(CHANNEL_ID,"Notifikasi Admin CAMXD",NotificationManager.IMPORTANCE_HIGH);
                channel.setDescription("Pesanan baru dan pembayaran yang perlu diverifikasi");
                manager.createNotificationChannel(channel);
              }
              Intent intent=new Intent(this,MainActivity.class);
              intent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP|Intent.FLAG_ACTIVITY_SINGLE_TOP);
              intent.putExtra("camxd_admin_notification",true);
              String orderId=data.get("order_id");
              if(!TextUtils.isEmpty(orderId)) intent.putExtra("camxd_admin_order_id",orderId);
              PendingIntent pi=PendingIntent.getActivity(this,(int)System.currentTimeMillis(),intent,
                PendingIntent.FLAG_UPDATE_CURRENT|(Build.VERSION.SDK_INT>=23?PendingIntent.FLAG_IMMUTABLE:0));
              Notification.Builder b=Build.VERSION.SDK_INT>=Build.VERSION_CODES.O?new Notification.Builder(this,CHANNEL_ID):new Notification.Builder(this);
              b.setSmallIcon(R.drawable.camxd_admin_icon).setContentTitle(title).setContentText(body)
                .setStyle(new Notification.BigTextStyle().bigText(body)).setAutoCancel(true).setContentIntent(pi)
                .setPriority(Notification.PRIORITY_HIGH).setCategory(Notification.CATEGORY_STATUS);
              manager.notify((int)(System.currentTimeMillis()&0x7fffffff),b.build());
            }
          }
          EOF
          cat > admin-android/app/src/main/java/com/camxd/admin/MainActivity.java <<'EOF'
          package com.camxd.admin;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.*;
          import android.content.*;
          import android.net.Uri;
          public class MainActivity extends Activity {
            WebView webView;
          ValueCallback<Uri[]> fileCallback;
          static final int FILE_REQUEST=1001;
            @Override public void onCreate(Bundle b){super.onCreate(b); webView=new WebView(this); setContentView(webView);
              WebSettings s=webView.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setDatabaseEnabled(true);
              s.setSupportZoom(false); webView.setWebChromeClient(new WebChromeClient(){
                @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> callback, FileChooserParams params){
                  fileCallback=callback;
                  try{
                    Intent i=params.createIntent();
                    startActivityForResult(i, FILE_REQUEST);
                    return true;
                  }catch(Exception e){
                    fileCallback=null;
                    return false;
                  }
                }
              }); webView.setWebViewClient(new WebViewClient(){
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r){
                  String url=r.getUrl().toString();
                  if(url.startsWith("http://") || url.startsWith("https://")){
                    v.loadUrl(url);
                    return true;
                  }
                  try{
                    Intent intent=new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                    startActivity(intent);
                  }catch(Exception e){
                    android.widget.Toast.makeText(MainActivity.this,"Aplikasi untuk membuka link tidak ditemukan",android.widget.Toast.LENGTH_SHORT).show();
                  }
                  return true;
                }
              });
              webView.loadUrl("https://vertifikasiakuncam-dotcom.github.io/camxd-store/admin.html?v=20261006-11");
            }
            @Override protected void onActivityResult(int requestCode,int resultCode,Intent data){
              if(requestCode==FILE_REQUEST && fileCallback!=null){
                Uri[] result=(resultCode==RESULT_OK && data!=null && data.getData()!=null)
                  ? new Uri[]{data.getData()} : null;
                fileCallback.onReceiveValue(result);
                fileCallback=null;
              }
              super.onActivityResult(requestCode,resultCode,data);
            }
            long lastBackPress=0;
            @Override public void onBackPressed(){
              if(webView.canGoBack()){ webView.goBack(); return; }
              long now=System.currentTimeMillis();
              if(now-lastBackPress < 1800){ super.onBackPressed(); return; }
              lastBackPress=now;
              android.widget.Toast.makeText(this,"Tekan sekali lagi untuk keluar",android.widget.Toast.LENGTH_SHORT).show();
            }
            @Override protected void onDestroy(){webView.destroy(); super.onDestroy();}
          }
          EOF
      - name: Configure Firebase Admin
        env:
          FIREBASE_ADMIN_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_ADMIN_GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          test -n "$FIREBASE_ADMIN_GOOGLE_SERVICES_JSON" || (echo "Secret FIREBASE_ADMIN_GOOGLE_SERVICES_JSON belum tersedia"; exit 1)
          printf '%s' "$FIREBASE_ADMIN_GOOGLE_SERVICES_JSON" > admin-android/app/google-services.json
          python3 -m json.tool admin-android/app/google-services.json >/dev/null
      - name: Build and sign
        working-directory: admin-android
        shell: bash
        env:
          CAMXD_KEYSTORE_BASE64: ${{ secrets.CAMXD_KEYSTORE_BASE64 }}
          CAMXD_KEYSTORE_PASSWORD: ${{ secrets.CAMXD_KEYSTORE_PASSWORD }}
          CAMXD_KEY_PASSWORD: ${{ secrets.CAMXD_KEY_PASSWORD }}
          CAMXD_KEY_ALIAS: ${{ secrets.CAMXD_KEY_ALIAS }}
        run: |
          set -e
          if ! command -v gradle >/dev/null 2>&1; then
            curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/g.zip
            unzip -q /tmp/g.zip -d /tmp
            export GRADLE=/tmp/gradle-8.10.2/bin/gradle
          else
            export GRADLE=gradle
          fi
          $GRADLE --no-daemon :app:assembleRelease
          mkdir -p ../signed
          python3 - <<'PY'
          import base64, os
          s = os.environ["CAMXD_KEYSTORE_BASE64"]
          s = "".join(s.split())
          s += "=" * ((4 - len(s) % 4) % 4)
          with open("../signed/key.jks", "wb") as f:
              f.write(base64.b64decode(s, validate=False))
          PY
          keytool -list -keystore ../signed/key.jks -storepass "$CAMXD_KEYSTORE_PASSWORD" -alias "$CAMXD_KEY_ALIAS" >/dev/null
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk ../signed/aligned.apk
          "$BT/apksigner" sign --ks ../signed/key.jks --ks-key-alias "$CAMXD_KEY_ALIAS" --ks-pass env:CAMXD_KEYSTORE_PASSWORD --key-pass env:CAMXD_KEY_PASSWORD --out ../signed/CAMXD-Admin.apk ../signed/aligned.apk
          "$BT/apksigner" verify --verbose ../signed/CAMXD-Admin.apk
          rm -f ../signed/key.jks ../signed/aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CAMXD-Admin-APK
          path: signed/CAMXD-Admin.apk
          retention-days: 30
