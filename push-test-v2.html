<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAMXD — Server Push Test v2</title>
<style>
body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif;padding:24px}
.card{max-width:520px;margin:40px auto;padding:24px;border:1px solid #d7ad00;border-radius:18px;background:#151515}
h1{margin-top:0;color:#ffd400}.muted{color:#aaa;line-height:1.5}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#ffd400;color:#111;font-weight:700;font-size:16px;margin-top:10px}
button:disabled{opacity:.6}.status{margin-top:18px;padding:14px;border-radius:12px;background:#222;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.5}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>
<div class="card">
<h1>🔔 CAMXD Server Push Test v2</h1>
<p class="muted">Halaman diagnostic terpisah. Tidak mengubah dashboard dan tidak membuat order.</p>
<button id="statusBtn" type="button" onclick="window.camxdInspect && window.camxdInspect()">Periksa Service Worker</button>
<button id="test" type="button" onclick="window.camxdSendTest && window.camxdSendTest()">Kirim Test Push</button>
<div id="status" class="status">Siap. Tekan tombol untuk memeriksa Service Worker.</div>
</div>

<script>
const statusBtn=document.getElementById("statusBtn");
const out=document.getElementById("status");

function show(t){out.textContent=t;}

async function withTimeout(p,ms,label){
  return await Promise.race([
    p,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+" timeout")),ms))
  ]);
}

async function inspect(){
  show("⏳ Tombol bekerja. Memeriksa Service Worker...");
  const lines=[];
  try{
    if(!("serviceWorker" in navigator)){
      show("❌ Service Worker tidak didukung browser ini.");
      return;
    }

    let regs=[];
    try{
      regs=await withTimeout(navigator.serviceWorker.getRegistrations(),3000,"getRegistrations");
    }catch(e){
      show("❌ Gagal membaca Service Worker: "+e.message);
      return;
    }

    lines.push("Service Worker ditemukan: "+regs.length);

    if(!regs.length){
      lines.push("❌ Tidak ada Service Worker terdaftar.");
      show(lines.join("\n"));
      return;
    }

    for(let i=0;i<regs.length;i++){
      const reg=regs[i];
      lines.push("\n["+(i+1)+"]");
      lines.push("scope: "+reg.scope);
      lines.push("active: "+(reg.active?.scriptURL||"tidak ada"));
      lines.push("waiting: "+(reg.waiting?.scriptURL||"tidak ada"));
      lines.push("installing: "+(reg.installing?.scriptURL||"tidak ada"));

      try{
        const sub=await withTimeout(reg.pushManager.getSubscription(),3000,"getSubscription");
        lines.push("Push subscription: "+(sub?"ADA":"TIDAK ADA"));
        if(sub) lines.push("endpoint: "+new URL(sub.endpoint).hostname);
      }catch(e){
        lines.push("Push subscription: ERROR - "+e.message);
      }
    }

    try{
      const cache=await withTimeout(caches.open("camxd-admin-v21"),3000,"cache open");
      const response=await withTimeout(cache.match("./__camxd_push_received.json"),3000,"cache match");
      if(response){
        const marker=await response.json();
        lines.push("\nPUSH MARKER: DITERIMA");
        lines.push("receivedAt: "+marker.receivedAt);
        lines.push("title: "+marker.title);
        lines.push("body: "+marker.body);
      }else{
        lines.push("\nPUSH MARKER: BELUM ADA");
      }
    }catch(e){
      lines.push("\nMarker check: ERROR - "+e.message);
    }

    show(lines.join("\n"));
  }catch(e){
    show("❌ ERROR: "+(e?.message||e));
  }
}

window.camxdSendTest=async()=>{
  const btn=document.getElementById("test");
  btn.disabled=true;
  show("⏳ Mengirim test push ke server...");
  try{
    const {data:{session},error}=await supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}).auth.getSession();
    if(error||!session?.access_token) throw new Error("Sesi Admin tidak ditemukan. Login di Dashboard Admin terlebih dahulu.");
    const res=await fetch(SUPABASE_URL+"/functions/v1/send-admin-push-test",{method:"POST",headers:{Authorization:"Bearer "+session.access_token,"Content-Type":"application/json"},body:"{}"});
    const raw=await res.text();
    show("SERVER RESULT\nHTTP "+res.status+"\n"+raw+"\n\n⏳ Menunggu push 4 detik...");
    setTimeout(inspect,4000);
  }catch(e){show("❌ "+(e?.message||e));}
  finally{btn.disabled=false;}
};

window.camxdInspect=()=>{
  show("🟡 KLIK TERDETEKSI — memulai pemeriksaan...");
  setTimeout(inspect,50);
};
</script>
</body>
</html>
