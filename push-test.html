<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAMXD — Server Push Test</title>
<style>
body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif;padding:24px}
.card{max-width:520px;margin:40px auto;padding:24px;border:1px solid #d7ad00;border-radius:18px;background:#151515}
h1{margin-top:0;color:#ffd400}.muted{color:#aaa;line-height:1.5}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#ffd400;color:#111;font-weight:700;font-size:16px}
button:disabled{opacity:.6}.status{margin-top:18px;padding:14px;border-radius:12px;background:#222;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="card">
<h1>🔔 CAMXD Server Push Test</h1>
<p class="muted">Halaman test terpisah. Tidak mengubah dashboard dan tidak membuat order.</p>
<button id="test">Kirim Test Push</button>
<div id="status" class="status">Siap melakukan test.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(async()=>{
 const btn=document.getElementById("test"), out=document.getElementById("status");
 const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
 async function run(){
   btn.disabled=true; out.textContent="Mengirim test push ke server...";
   try{
     const {data:{session},error:sessionError}=await sb.auth.getSession();
     if(sessionError||!session?.access_token){
       out.textContent="❌ Sesi Admin tidak ditemukan. Buka Dashboard Admin dan login terlebih dahulu.";
       return;
     }
     const res=await fetch(SUPABASE_URL+"/functions/v1/send-admin-push-test",{
       method:"POST",
       headers:{Authorization:"Bearer "+session.access_token,"Content-Type":"application/json"},
       body:"{}"
     });
     const raw=await res.text();
     let data; try{data=JSON.parse(raw)}catch{data={raw}};
     out.textContent="HTTP "+res.status+"\n"+JSON.stringify(data,null,2);
   }catch(e){out.textContent="❌ "+String(e?.message||e)}
   finally{btn.disabled=false}
 }
 btn.addEventListener("click",run);
})();
</script>
</body>
</html>
